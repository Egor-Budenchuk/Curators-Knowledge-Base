<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>База знаний — Цифровой колледж имени Башира Рамеева</title>
<!-- Шрифт: по умолчанию системный (Onest/Manrope/Montserrat, если установлены, иначе Arial).
     Чтобы подключить Onest из интернета, раскомментируйте строку ниже (нужен доступ в сеть):
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700;800&display=swap" rel="stylesheet"> -->
<style>
:root{--k:#1C1C1E;--b:#6F8FF0;--bl:#C8D4F8;--l:#EEFF6B;--bg:#F3F4F7;--nc:#F1F2F4;--g:#9AA0AB;--t:#5B6170}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Onest,Manrope,Montserrat,Arial,sans-serif;color:var(--k);background:var(--bg);line-height:1.5;font-size:15px}
a{color:var(--k);font-weight:700;text-decoration:underline;text-decoration-color:var(--b);text-decoration-thickness:2px;text-underline-offset:3px}
button{font-family:inherit}
.hide{display:none!important}
/* вход */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{background:#fff;border:1px solid var(--bl);border-left:6px solid var(--b);border-radius:14px;padding:28px;max-width:400px;width:100%}
.lbox img{height:48px;display:block;margin-bottom:20px}
.lbox h1{font-size:26px;font-weight:800;margin:0 0 6px}
.lbox p{color:var(--t);margin:0 0 16px;font-size:13px}
input{font-family:inherit;font-size:15px;border:1px solid var(--k);border-radius:10px;padding:10px 14px;width:100%;background:#fff;color:var(--k)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.btn{display:inline-block;background:var(--l);border:1px solid var(--k);border-radius:10px;color:var(--k);font-weight:700;font-size:12px;padding:7px 14px;cursor:pointer;text-decoration:none}
.btn.big{margin-top:12px;font-size:14px;padding:10px 20px}
#err{font-weight:700;font-size:13px;margin-top:10px;min-height:18px}
/* шапка */
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 40px}
.hero{background:linear-gradient(90deg,var(--b),#FAFBFF);border-radius:28px;padding:24px 28px;display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap;align-items:flex-start}
.logo{background:#fff;border-radius:16px;padding:8px 14px;display:inline-block;margin-bottom:16px}
.logo img{height:38px;display:block}
.org{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.hero h1{font-size:clamp(28px,5vw,40px);font-weight:800;margin:4px 0;line-height:1.15}
.sub{font-size:13px}
.plates{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.date{background:var(--k);color:#fff;font-weight:700;font-size:22px;border-radius:16px;padding:10px 20px}
.badge{background:var(--l);border:1px solid var(--k);font-weight:700;font-size:12px;border-radius:12px;padding:5px 12px}
.bar{display:flex;gap:10px;margin:16px 0;align-items:center}
.bar input{flex:1}
.lay{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
@media(max-width:820px){.lay{grid-template-columns:1fr}.hero{padding:20px}.plates{align-items:flex-start}}
/* меню */
nav{background:#fff;border:1px solid var(--bl);border-radius:14px;padding:10px;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
nav a{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:10px;text-decoration:none;font-weight:600;font-size:13px}
nav a:hover{background:var(--bg)}
nav a.on{background:var(--k);color:#fff}
nav a.sec{margin-left:22px;font-weight:400;font-size:12px;color:var(--t)}
.chip{display:inline-block;background:var(--l);border:1px solid var(--k);border-radius:8px;font-weight:700;font-size:12px;padding:1px 8px;color:var(--k);flex:none}
main{min-width:0}
.eb{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;display:flex;gap:8px;align-items:center;margin-top:32px}
h1.d{font-size:clamp(26px,4vw,36px);font-weight:800;margin:0 0 6px}
h2{font-size:clamp(22px,3vw,26px);font-weight:700;margin:8px 0 10px}
h3{font-size:17px;font-weight:700;margin:22px 0 6px}
p{margin:0 0 12px;max-width:80ch}
.small{font-size:12px;color:var(--t)}
/* карточки */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{display:block;background:#fff;border:1px solid var(--bl);border-left:6px solid var(--b);border-radius:14px;padding:15px;text-decoration:none;font-weight:400}
a.card:hover{border-color:var(--b)}
.card b{display:block;font-size:15px;margin:6px 0 2px}
.card span.d{color:var(--t);font-size:13px}
/* блоки */
.imp{position:relative;background:#fff;border:1px solid var(--bl);border-left:6px solid var(--b);border-radius:14px;padding:30px 16px 14px;margin:14px 0}
.imp .chip{position:absolute;top:-1px;left:12px;border-top:0;border-radius:0 0 8px 8px}
.info{background:var(--bg);border-radius:16px;padding:16px;margin:14px 0}
.main-bg .info{background:#E9EAEF}
.info>b{display:block;margin-bottom:4px}
.quote{background:var(--k);color:#fff;border-radius:16px;padding:20px;margin:14px 0;font-weight:700;font-size:18px}
.quote .hl{color:var(--l);background:none}
.msg{background:var(--nc);border:1px dashed var(--g);border-radius:14px;padding:14px 16px;margin:14px 0}
.msg .h{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px;font-weight:700}
.msg .tx{background:#fff;border:1px solid var(--g);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:14px}
.cp{margin-top:10px}
.hl{background:var(--l);border-radius:4px;padding:0 3px}
mark{background:var(--l);color:var(--k);border-radius:4px;padding:0 2px;outline:1px solid var(--k)}
ul.l{list-style:none;padding:0;margin:8px 0 14px}
ul.l li{position:relative;padding-left:20px;margin:7px 0}
ul.l li:before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:2px;background:var(--b)}
ol.l{list-style:none;padding:0;margin:8px 0 14px;counter-reset:n}
ol.l li{counter-increment:n;position:relative;padding-left:40px;margin:10px 0;min-height:28px}
ol.l li:before{content:counter(n);position:absolute;left:0;top:-1px;width:28px;height:28px;border-radius:8px;background:var(--k);color:#fff;font-weight:700;text-align:center;line-height:28px}
.tw{overflow-x:auto}
table{border-collapse:separate;border-spacing:8px;width:100%;min-width:480px;margin:6px -8px}
th{background:var(--k);color:#fff;border-radius:12px;padding:10px 14px;text-align:left;font-size:14px}
td{background:#fff;border:1px solid var(--bl);border-left:5px solid var(--b);border-radius:14px;padding:12px 14px;vertical-align:top}
td.side{background:var(--bg);border:0;font-weight:700}
td.empty{background:#F7F8FA;border:0}
td.foot{background:#E4E6EB;border:0;font-weight:700}
.kv{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:6px 16px;margin:10px 0}
.kv .k{color:var(--t)}.kv .v{font-weight:700}
.foot2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:36px}
@media(max-width:820px){.foot2{grid-template-columns:1fr}}
.foot2>div{background:var(--bg);border:1px solid #E1E3E9;border-radius:16px;padding:16px;font-size:12px}
.res{background:#fff;border:1px solid var(--bl);border-left:6px solid var(--b);border-radius:14px;padding:12px 16px;margin:8px 0;display:block;text-decoration:none;font-weight:400}
.res b{display:block}
.res .p{font-size:12px;color:var(--t)}
.res .s{font-size:13px;margin-top:4px}
.sep{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--b),#FAFBFF);margin:28px 0}
</style>
</head>

<script>
/* ==========================================================================
   1. НАСТРОЙКИ  (пароль, названия, шапка, подвал)
   Подробная инструкция — в файле «Инструкция.txt»

const CONFIG = {
  password: '2026',                                  // ← ПАРОЛЬ ВХОДА
  org:      'Цифровой колледж имени Башира Рамеева', // надзаголовок в шапке
  title:    'База знаний',                           // заголовок в шапке
  subtitle: 'Для кураторов и студентов',             // подзаголовок (можно писать «А · Б · В»)
  date:     '',                                      // чёрная плашка справа, например 'Нояб 2026'; '' — скрыть
  badge:    'Версия 1.0',                            // лаймовый бейдж; '' — скрыть
  footer: {
    rulesTitle:    'Как пользоваться',
    rules:         '**Поиск:** введите слово в строке сверху. **Копирование:** кнопка «▸ Скопировать» рядом с шаблонами и важными блоками.',

/* ==========================================================================
   2. ДОКУМЕНТЫ  (вся база знаний)
   Один документ = один объект в списке DOCS. Порядок = порядок в оглавлении.
   Типы блоков и примеры — в «Инструкции.txt». Ниже — рабочий пример со всеми
   типами блоков. Удалите его, когда добавите свои документы.
   Разметка в тексте: **жирный**  ==лайм-маркер==  [[id-документа|ссылка]]
   [[id-документа#id-раздела|ссылка на раздел]]  [текст](https://адрес)
   ========================================================================== */
const DOCS = [
  {
    id: 'example',                    // латиница/цифры/дефис, уникально
    title: 'Пример документа',        // название в оглавлении и поиске
    eyebrow: 'ШАБЛОН',                // надзаголовок капсом (необязательно)
    desc: 'Образец всех блоков. Удалите этот документ после изучения.', // строка на карточке
    blocks: [
      {t:'h2', id:'text', text:'Текст и выделение'},
      {t:'p', text:'Обычный абзац. **Жирным** выделяем термины и сроки, а ==лаймовым маркером== — самое критичное. Ссылка на сайт: [Цифровой колледж](https://example.com). Ссылка на раздел: [[example#table|к таблице]].'},
      {t:'important', title:'Важно', text:'Ключевая фраза — **жирным**. Блок можно скопировать.', copy:true},
      {t:'info', title:'Справка', text:'Серый информационный блок для пояснений и контактов.'},
      {t:'quote', text:'Ключевой тезис на чёрной плашке, ==важное слово== лаймом.'},
      {t:'h2', id:'lists', text:'Списки'},
      {t:'ul', items:['**Термин:** пояснение к пункту.', '**Ещё один:** максимум 5–7 пунктов в списке.']},
      {t:'ol', items:['Первый шаг инструкции.', 'Второй шаг инструкции.']},
      {t:'kv', rows:[['Куратор','Иванова А. А.'], ['Почта','[mail@example.com](https://example.com)']]},
      {t:'h2', id:'table', text:'Таблица'},
      {t:'table', side:true, head:['Время','Понедельник','Вторник'], rows:[['1 пара','Математика','—'], ['2 пара','','Информатика']], foot:['Итого','1','1']},

      {t:'sep'},
      {t:'btn', text:'Открыть сайт', url:'https://example.com'}

/* ==========================================================================
   3. ДВИЖОК (менять не нужно)
   ========================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inl = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<span class="hl">$1</span>')
  .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,(m,a,t)=>`<a href="#/${a.replace('#','/')}">${t}</a>`)
  .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>');
const plain = s => String(s).replace(/\[\[[^\]|]+\|([^\]]+)\]\]/g,'$1').replace(/\*\*(.+?)\*\*/g,'$1').replace(/==(.+?)==/g,'$1').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'$1 ($2)');
const tx = o => typeof o==='string' ? o : Array.isArray(o) ? o.map(tx).join(' ') : o&&typeof o==='object' ? Object.entries(o).filter(([k])=>!['t','id','url','to','copy','side'].includes(k)).map(([,v])=>tx(v)).join(' ') : '';
const COPY = [];
const cbtn = (text,label) => { COPY.push(text); return `<button class="btn cp" data-c="${COPY.length-1}">▸ ${label||'Скопировать'}</button>`; };

// индексация: id разделов, тексты для поиска
DOCS.forEach(d => { let n=0, cur=null; d.blocks.forEach(b => {
  if(b.t==='h2'||b.t==='h3'){ b.id = b.id || 's'+(++n)+'x'; cur=b; }
  b._sec = cur; b._txt = plain(tx(b)); }); d._txt = plain(d.title+' '+(d.desc||'')); });

function renderBlock(b, st){
  switch(b.t){
    case 'h2': st.n++; return `<div class="eb"><span class="chip">${String(st.n).padStart(2,'0')}</span>${esc(b.eyebrow||'')}</div><h2 id="${b.id}">${inl(b.text)}</h2>`;
    case 'h3': return `<h3 id="${b.id}">${inl(b.text)}</h3>`;
    case 'p': return `<p>${inl(b.text)}</p>`+(b.copy?cbtn(plain(b.text)):'');
    case 'ul': return `<ul class="l">${b.items.map(i=>`<li>${inl(i)}</li>`).join('')}</ul>`;
    case 'ol': return `<ol class="l">${b.items.map(i=>`<li>${inl(i)}</li>`).join('')}</ol>`;
    case 'kv': return `<div class="kv">${b.rows.map(r=>`<div class="k">${inl(r[0])}</div><div class="v">${inl(r[1])}</div>`).join('')}</div>`;
    case 'important': return `<div class="imp"><span class="chip">${esc(b.title||'Важно')}</span>${inl(b.text)}${b.copy?'<br>'+cbtn(plain(b.text)):''}</div>`;
    case 'info': return `<div class="info"><b>${inl(b.title||'')}</b>${inl(b.text)}${b.copy?'<br>'+cbtn(plain(b.text)):''}</div>`;
    case 'quote': return `<div class="quote">${inl(b.text)}${b.copy?'<br>'+cbtn(plain(b.text)):''}</div>`;
    case 'msg': return `<div class="msg"><div class="h"><span>${inl(b.title||'Шаблон сообщения')}</span></div><div class="tx">${esc(plain(b.text))}</div>${cbtn(plain(b.text),'Скопировать сообщение')}</div>`;
    case 'table': { const c=(v,i,cls)=>{ const e=v===''||v==null; return `<td class="${e?'empty':(b.side&&i===0?'side':cls||'')}">${e?'':inl(v)}</td>`; };
      return `<div class="tw"><table><thead><tr>${b.head.map(h=>`<th>${inl(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map((v,i)=>c(v,i)).join('')}</tr>`).join('')}${b.foot?`<tr>${b.foot.map((v,i)=>c(v,i,'foot')).join('')}</tr>`:''}</tbody></table></div>`+(b.copy?cbtn(b.rows.map(r=>r.map(plain).join('\t')).join('\n'),'Скопировать таблицу'):''); }
    case 'cards': return `<div class="grid">${b.items.map(i=>`<${i.to?'a href="#/'+i.to.replace('#','/')+'"':'div'} class="card"><b>${inl(i.title)}</b><span class="d">${inl(i.text||'')}</span></${i.to?'a':'div'}>`).join('')}</div>`;
    case 'btn': return `<p><a class="btn" href="${esc(b.url)}" target="_blank" rel="noopener">▸ ${esc(b.text)}</a></p>`;
    case 'sep': return '<div class="sep"></div>';
  } return '';
}

let HL = [];
function highlight(root){
  if(!HL.length) return;
  const re = new RegExp('('+HL.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes=[];
  while(w.nextNode()) if(!w.currentNode.parentElement.closest('button,script')) nodes.push(w.currentNode);
  nodes.forEach(n => { if(!re.test(n.nodeValue)) return; re.lastIndex=0;
    const sp=document.createElement('span'); sp.innerHTML=esc(n.nodeValue).replace(re,'<mark>$1</mark>'); n.replaceWith(sp); });
}
const words = () => $('q').value.trim().toLowerCase().split(/\s+/).filter(w=>w.length>1);

function buildNav(cur){
  $('nav').innerHTML = `<a href="#/" class="${!cur?'on':''}">⌂ Оглавление</a>` + DOCS.map((d,i)=>
    `<a href="#/${d.id}" class="${cur&&cur.id===d.id?'on':''}"><span class="chip">${String(i+1).padStart(2,'0')}</span>${esc(d.title)}</a>` +
    (cur&&cur.id===d.id ? d.blocks.filter(b=>b.t==='h2').map(b=>`<a class="sec" href="#/${d.id}/${b.id}">${esc(plain(b.text))}</a>`).join('') : '')).join('');
}

function route(){
  const [,id,sec] = location.hash.split('/'); HL = words();
  const d = DOCS.find(x=>x.id===id); buildNav(d); const m=$('main');
  if(!d){
    m.innerHTML = `<div class="eb" style="margin-top:0">Оглавление</div><h1 class="d">Разделы базы знаний</h1>` + (DOCS.length ?
      `<div class="grid">${DOCS.map((x,i)=>`<a class="card" href="#/${x.id}"><span class="chip">${String(i+1).padStart(2,'0')}</span><b>${esc(x.title)}</b><span class="d">${esc(x.desc||'')}</span></a>`).join('')}</div>` :
      '<div class="info"><b>База знаний пока пуста</b>Добавьте документы в список DOCS — см. «Инструкция.txt».</div>');
    window.scrollTo(0,0); return;
  }
  const st={n:0};
  m.innerHTML = `<div class="eb" style="margin-top:0">${esc(d.eyebrow||'Документ')}</div><h1 class="d">${esc(d.title)}</h1><p class="small">${esc(d.desc||'')}</p>` + d.blocks.map(b=>renderBlock(b,st)).join('') +
    `<p style="margin-top:32px"><a class="btn" href="#/">▸ К оглавлению</a></p>`;
  highlight(m);
  const t = sec && $(sec); if(t) t.scrollIntoView(); else { const k=m.querySelector('mark'); k?k.scrollIntoView({block:'center'}):window.scrollTo(0,0); }
}

function search(){
  const ws = words(); if(!ws.length){ route(); return; } HL = ws; buildNav(null);
  const out=[]; DOCS.forEach(d=>{
    if(ws.every(w=>d._txt.toLowerCase().includes(w))) out.push({d, sec:null, txt:d.desc||'', title:d.title});
    d.blocks.forEach(b=>{ const low=b._txt.toLowerCase(); if(b._txt && ws.every(w=>low.includes(w))) out.push({d, sec:b._sec||null, txt:b._txt, title:d.title}); }); });
  const re = new RegExp('('+ws.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  $('main').innerHTML = `<div class="eb" style="margin-top:0">Поиск</div><h1 class="d">Найдено: ${out.length}</h1>` + (out.length? out.slice(0,60).map(r=>{
    const i=r.txt.toLowerCase().indexOf(ws[0]), s=r.txt.slice(Math.max(0,i-60), i+120);
    return `<a class="res" href="#/${r.d.id}${r.sec?'/'+r.sec.id:''}"><b>${esc(r.d.title)}</b><div class="p">${r.sec?'Раздел: '+esc(plain(r.sec.text)):'Документ целиком'}</div><div class="s">…${esc(s).replace(re,'<mark>$1</mark>')}…</div></a>`;}).join('') :
    '<div class="info"><b>Ничего не найдено</b>Попробуйте другое слово или его начало, например «распис» вместо «расписание».</div>');
  window.scrollTo(0,0);
}

/* вход */
const ok = () => { try{ return sessionStorage.getItem('kb_ok')==='1'; }catch(e){ return false; } };
function enter(){ $('login').classList.add('hide'); $('app').classList.remove('hide');
  $('h-org').textContent=CONFIG.org; $('h-title').textContent=CONFIG.title; $('h-sub').textContent=CONFIG.subtitle;
  $('h-date').textContent=CONFIG.date; $('h-date').classList.toggle('hide',!CONFIG.date);
  $('h-badge').textContent=CONFIG.badge; $('h-badge').classList.toggle('hide',!CONFIG.badge);
  const f=CONFIG.footer; $('foot').innerHTML = `<div><b>${inl(f.rulesTitle)}</b><br>${inl(f.rules)}</div>` +
    (f.contacts.length?`<div><b>${inl(f.contactsTitle)}</b><div class="kv">${f.contacts.map(r=>`<div class="k">${inl(r[0])}</div><div class="v">${inl(r[1])}</div>`).join('')}</div></div>`:'');
  route(); }
function tryLogin(){ if($('pw').value===String(CONFIG.password)){ try{sessionStorage.setItem('kb_ok','1');}catch(e){} enter(); } else { $('err').textContent='Неверный пароль. Проверьте и введите ещё раз.'; $('pw').select(); } }
$('go').onclick = tryLogin; $('pw').onkeydown = e => { if(e.key==='Enter') tryLogin(); };
$('q').oninput = search;
window.addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const r = e.target.closest('a.res'); if(r){ e.preventDefault(); const h=r.getAttribute('href'); location.hash===h ? route() : (location.hash=h); return; }
  const b = e.target.closest('[data-c]'); if(!b) return; const t = COPY[b.dataset.c], old = b.textContent;
  const done = () => { b.textContent='✓ Скопировано'; setTimeout(()=>b.textContent=old,1500); };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done,()=>fb(t,done)); else fb(t,done);
});
function fb(t,done){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand('copy');done();}catch(e){} a.remove(); }
if(ok()) enter(); else $('pw').focus();
</script>
</body>
</html>
