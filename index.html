      {t:'p', text:'**Где ведётся.** Задачник (платформа колледжа), Google Таблицы'},
      {t:'h3', id:'links-p5-6', text:'Что открыть'},
      {t:'ul', items:['[З-01 Задачник (app.rameev.space)](https://app.rameev.space)', '[З-02 Шаблон постановки задачи](https://docs.google.com/spreadsheets/d/1lxLbSOwz_cs579BggFni6oH9q9ZxL2GLGjL-YrOpPXg/edit#gid=1579413575)', '[Вкладка «Задачник»](https://docs.google.com/spreadsheets/d/1lxLbSOwz_cs579BggFni6oH9q9ZxL2GLGjL-YrOpPXg/edit#gid=1579413575)']},
      {t:'important', title:'Готово, если', text:'У каждой задачи есть результат, этапы, срок и ссылка на данные; закрытые — с приложенной таблицей.'},
      {t:'info', title:'Если не по стандарту', text:'Задача без данных не закрывается. Срок истёк — попадает в недельную сводку ([[soprovozhdenie#p3-11|3.11]]). Передача группы — открытые задачи переоформляются.'},
      {t:'info', title:'Примечание', text:'Поля в задачнике пустые: каждую задачу описываем индивидуально — что нужно, этапы, срок, что приложить в конце.'},
      {t:'cards', items:[{title:'3.11 Отчётность куратора', text:'связанный процесс', to:'soprovozhdenie#p3-11'}]},
      {t:'h2', id:'p5-7', text:'5.7 Оформление материалов по бренд-гайдлайну'},
      {t:'p', text:'**Результат.** Любая презентация, анонс, справка и отчёт оформлены по гайдлайну: палитра, шрифт, шапка с логотипом.'},
      {t:'kv', rows:[['Когда запускается','Готовим презентацию, анонс, справку, отчёт или любой документ для студентов и колледжа.'], ['Кто делает','Куратор'], ['Срок / SLA','Проверка оформления — до отправки, минимум за 1 день']]},
      {t:'ol', items:['1) Скачать три файла: гайдлайн оформления, лукбук, логотип.', '2) Взять утверждённый шаблон презентации или документа, не рисовать с нуля.', '3) Сверить цвета и шрифт с палитрой, собрать шапку по правилам (градиент, логотип, плашка даты).', '4) Таблицы собирать из карточек, а не из линий сетки.', '5) Пройти чек-листы «чего не делать» и «перед отправкой».', '6) Отдать на проверку руководителю до отправки студентам.']},
      {t:'p', text:'**Где ведётся.** Google Диск «База знаний/Артефакты», Google Презентации / Документы'},
      {t:'h3', id:'links-p5-7', text:'Что открыть'},
      {t:'ul', items:['[Ф-01 Гайдлайн оформления документов](https://docs.google.com/document/d/1YbhFtS4gmsixiYqvaXsTWydJ-Hfs6-Mc/edit)', '[Ф-02 Лукбук (PDF)](https://drive.google.com/file/d/1HpY9vog211X2gbdA2P1_1UB9TqssE3ss/view)', '[Ф-03 Логотип (PNG)](https://drive.google.com/file/d/1ZqG8bPvv7gw-kw5zGwb6l-YHN9oGGn8n/view)', '[Ф-06 База знаний / Артефакты](https://drive.google.com/drive/folders/1DtJrvrG0PYQ5lqiqup0InkDQZeLHBvWh)', '[Вкладка «Бренд И Оформление»](https://docs.google.com/spreadsheets/d/1lxLbSOwz_cs579BggFni6oH9q9ZxL2GLGjL-YrOpPXg/edit#gid=1229596276)']},
      {t:'important', title:'Готово, если', text:'Палитра и типографика соблюдены, логотип на каждом слайде и странице, чек-лист пройден.'},
      {t:'info', title:'Если не по стандарту', text:'Нет времени — берём прошлый утверждённый файл. Спорное оформление решает руководитель.'},
      {t:'info', title:'Примечание', text:'Правило: сначала три файла, потом творчество.'},
    ]
  },
  {
    id: 'tone-of-voice',
    title: 'Tone of voice',
    eyebrow: 'ОБЩЕНИЕ',
    desc: '1. Позиция куратора: кто мы для студента',
    blocks: [
      {t:'p', text:'Как куратор пишет и говорит: позиция, правила, словарь замен и 14 готовых шаблонов.'},
      {t:'h2', id:'s-1-позиция-куратора-кто-мы-для-студента', text:'1. Позиция куратора: кто мы для студента'},
      {t:'kv', rows:[['Роль','Старший товарищ, который решает проблемы, а не надзиратель и не проверяющий. Студент должен быть уверен: напишет — помогут. — Формулировка из вашего приветствия'], ['Обращение','На «ты», по имени, без отчества. Со студентом с первого сообщения, если он сам не перешёл на «вы». — «Привет, Иван!» — не «Уважаемый Иван Сергеевич»'], ['Кто главный','Студент — взрослый человек, который сам принимает решения. Мы информируем и помогаем, но не заставляем. — «Смотри, есть два варианта…» — не «Ты обязан»'], ['В конфликте','Мы на стороне студента и на стороне правил одновременно. Не защищаем коллег и не обвиняем студента. — «Понимаю, неприятно. Давай разберёмся, что можно сделать»'], ['Чего не делаем','Не воспитываем, не читаем морали, не сравниваем студентов между собой, не шутим про отчисление и деньги. — Это главные причины, по которым студенты перестают писать куратору']]},
      {t:'h2', id:'s-2-восемь-правил-сообщения', text:'2. Восемь правил сообщения'},
      {t:'kv', rows:[['1. Коротко','3–5 строк. Если нужен список — 3–5 пунктов. Длинное — файлом или на встрече. — Студент читает с телефона между парами'], ['2. Суть в первой строке','Первая строка = ответ или действие. Не «здравствуйте, хотел уточнить…» — «Оплату подтвердил, всё в порядке» — далее детали'], ['3. Всегда следующий шаг','В каждом сообщении: что дальше, кто делает, когда. Без «мы подумаем». — «Соберу ответ у учебного отдела и напишу до 18:00»'], ['4. Без канцелярита','Никаких «в соответствии с регламентом», «уведомляем вас», «в случае неоплаты». Только живой язык. — «По нашим правилам оплата до 5 числа — успеваешь?»'], ['5. Без обвинений','Только факты и следующий шаг. Не «вы опять не сдали», а «домашка не пришла — что мешает?» — Обвинение вызывает защиту, а нам нужен результат'], ['6. Эмодзи — 0 или 1','Один эмодзи максимум, и никогда в сообщениях про деньги, отчисление и конфликт. — Хорошо: «спасибо! 🙌». Плохо: три смайла в письме об отчислении']]},
      {t:'kv', rows:[['7. Не «нет», а «так нельзя — можно вот так»','Отказ всегда с альтернативой или объяснением причины. — «Перенести дедлайн не могу, но можно сдать в пятницу с пометкой — так делают, договорился»'], ['8. Переспрашиваем, а не догадываемся','Если из сообщения непонятно, что нужно — один уточняющий вопрос, а не три версии ответа. — «Уточню, чтобы не гадать: тебе нужна справка для военкомата или для банка?»']]},
      {t:'h2', id:'s-3-формула-сообщения', text:'3. Формула сообщения'},
      {t:'kv', rows:[['Формула','Привет, [имя]! → [суть одной строкой] → [что делаю я / что нужно от тебя] → [когда вернусь с ответом] — Работает для 90% ситуаций'], ['Пример','Привет, Иван! По оплате всё прошло, чек приложил в чат. Тебе нужно до пятницы загрузить домашку по математике. Я напомню в четверг.'], ['Пример (сложный вопрос)','Привет, Аня! Вопрос по перерасчёту не в моей зоне, я уже передал его в бухгалтерию. Ответ будет до 12:00 завтра, напишу тебе первой. — Всегда называем срок, даже если он не наш']]},
      {t:'h2', id:'s-4-время-каналы-формат', text:'4. Время, каналы, формат'},
      {t:'kv', rows:[['Рабочее время','9:00–19:00, Пн–Пт. Всё, что пришло позже, — ответ до 10:00 следующего рабочего дня. — В воскресенье отвечаем только на критичное'], ['Срок ответа','До 2 часов в рабочее время. Сложный вопрос — «принял, отвечу до …» и ответ в тот же день. — Молчание — главная жалоба студентов'], ['Канал','Общаемся там, где удобно студенту: Telegram или Макс (два разрешённых мессенджера). Один студент — один основной канал. — Из вашего регламента (п. 1.3)'], ['Личное и общее','Личные вопросы (деньги, здоровье, конфликт) — в личку. Общие (встречи, дедлайны) — в чат группы. — В общем чате не обсуждаем успеваемость конкретного студента'], ['Звонок','Если 24 часа нет ответа, ситуация эмоциональная или нужно решить за 10 минут. Звоним один раз, потом пишем итог. — После звонка всегда письменное резюме в мессенджер'], ['Голосовые','Только если студент сам их отправляет или просит. По умолчанию — текст. — Голосовое нельзя перечитать и найти поиском']]},
      {t:'kv', rows:[['Встречи','Контур.Толк. Ссылка за 5 дней, напоминания за 1 день и за 1 час, после — запись и резюме. — Правила те же: коротко, со следующим шагом']]},
      {t:'h2', id:'s-5-словарь-замен-не-пишем-пишем', text:'5. Словарь замен: не пишем → пишем'},
      {t:'kv', rows:[['«Вы должны предоставить документы»','«Нужно, чтобы ты прислал сканы паспорта и СНИЛС — до пятницы»'], ['«Вам необходимо оплатить до 5 числа»','«До 5 числа нужно закрыть оплату за ноябрь — сумма …, реквизиты ниже»'], ['«Согласно регламенту…»','«По нашим правилам это делается так — чтобы тебе же было проще»'], ['«Это не моя зона»','«Это зона учебного отдела — я уже написал им, вернусь с ответом до 18:00»'], ['«Вы не сдали»','«Домашка не пришла — давай разберёмся, что мешает»'], ['«Уважаемый студент!»','«Привет, Иван!»']]},
      {t:'kv', rows:[['«Проблема решается»','«Делаю так-то, ответ будет в 15:00»'], ['«Нет, нельзя»','«Так нельзя, но можно вот так»'], ['«Я не знаю»','«Не знаю, уточню и вернусь до …»'], ['«Почему вы не отвечаете?»','«Не увидел твоё сообщение, извини — уже разбираюсь»'], ['«Как вам известно»','«Напомню»']]},
      {t:'h2', id:'s-6-что-запрещено', text:'6. Что запрещено'},
      {t:'kv', rows:[['Нельзя 1','Обсуждать преподавателей, оценки и других студентов в переписке со студентом. — Пишем только про процесс'], ['Нельзя 2','Обещать скидки, зачёты, «договоримся с преподавателем», изменение дедлайнов без согласования. — Любое обещание — только после «да» руководителя'], ['Нельзя 3','Давать медицинские, юридические и финансовые советы. — «Это лучше обсудить с врачом / юристом»'], ['Нельзя 4','Пересылать скриншоты переписок с другими студентами и любые персональные данные третьих лиц. — Персональные данные — только внутри отдела'], ['Нельзя 5','Писать родителям студента 18+ без его письменного согласия. — См. процесс 2.9'], ['Нельзя 6','Капс, «!!!», стикеры вместо ответа, «ну не знаю». — Это читается как равнодушие или агрессия']]},
      {t:'kv', rows:[['Нельзя 7','Оставлять вопрос без ответа, даже если ответ «пока нет». — «Принял, отвечу до …» — тоже ответ']]},
      {t:'h2', id:'s-7-шаблоны-сообщений-копировать-и-подстав', text:'7. Шаблоны сообщений (копировать и подставлять)'},
      {t:'kv', rows:[['1. Приветствие (первый контакт)','Привет, [имя]! Меня зовут [имя куратора], я буду твоим куратором на протяжении всего обучения. По всем вопросам, связанным с учёбой и доступами, ты можешь обращаться ко мне. Моя задача — помочь тебе, а не ругать и не проверять тебя. Уверен, что твоё обучение пройдёт замечательно!\n\nЯ добавлю тебя в чат группы [код группы] — там все анонсы и дедлайны. — Ваш исходный текст (п. 1.3), сохранён дословно'], ['2. Приглашение на установочную встречу','Привет, [имя]! [дата] в [время] проведём установочную встречу группы — обязательно будь.\nРазберём: как устроено обучение, где что лежит на платформе, как сдавать домашки, кто я и как со мной связываться.\nСсылка: [ссылка]. Зайти лучше за 5 минут и проверить звук. — За 5 дней до встречи'], ['3. Напоминание о встрече','Привет! Напоминаю: встреча сегодня в [время], ссылка та же — [ссылка]. Если не получается — напиши, разберём отдельно. — За 1 день и за 1 час'], ['4. Напоминание об оплате (за 15 дней)','Привет, [имя]! Напоминаю: до [дата] нужно закрыть оплату за [период], сумма [сумма]. Реквизиты и ссылка: [ссылка]. После оплаты пришли, пожалуйста, чек — я приложу к твоей карточке. — Норматив из п. 1.4'], ['5. Просрочка оплаты','Привет, [имя]! Оплата за [период] не пришла — сейчас числится долг [сумма]. Оплати, пожалуйста, до [дата] и пришли чек. Если есть сложности со сроком — напиши, обсудим график. — После 5 числа, вежливо и без угроз'], ['6. Просьба прислать документы','Привет, [имя]! Для [справки / договора / зачёта] нужны: [список]. Пришли, пожалуйста, фото или PDF до [дата]. Если чего-то нет — напиши, подскажу, где взять. — Проверьте читаемость сканов: паспорт, СНИЛС, аттестат']]},
      {t:'kv', rows:[['7. Не пришёл на встречу','Привет, [имя]! Тебя не было на встрече — всё в порядке? Запись здесь: [ссылка]. Если что-то непонятно по теме — напиши, разберём один на один. — Не «почему не пришёл», а забота'], ['8. «Не понял материал / тяжело»','Привет, [имя]! Это нормально — [тема] сложная, через неё проходят почти все. Давай так: пришли, что именно непонятно, я подберу материал или попрошу преподавателя разобрать на консультации. Могу созвониться завтра в [время] на 15 минут — подойдёт? — Не обещаем «всё будет легко», обещаем конкретную помощь'], ['9. Ответ на претензию','Привет, [имя]! Понял тебя, ситуация неприятная — извини за это. Что делаю: [действие], разберусь и напишу тебе до [дата/время]. Если нужно быстрее — позвони мне: [телефон]. — Никогда не спорим в первом сообщении'], ['10. Сообщение родителю (согласие получено)','[Имя Отчество], здравствуйте! Я куратор группы [код], меня зовут [имя]. Пишу по поводу [имя студента]: [факты с датами]. С нашей стороны: [что уже сделали]. Что важно от вас: [просьба]. Давайте созвонимся [дата] в [время] — мой телефон [телефон]. — Только факты, без оценок личности'], ['11. Предупреждение о риске отчисления','Привет, [имя]! Пишу прямо: накопилось [пропуски / долг / несданные работы], и это ставит под риск обучение. Варианты: [1) …, 2) …]. Скажи до [дата], какой выбираешь — я помогу оформить. Я на твоей стороне, но правила одинаковы для всех. — Всегда с вариантами, не только «отчислим»'], ['12. Уведомление об отчислении','Привет, [имя]! По [основание] обучение прекращается с [дата]. Что нужно сделать: [документы]. Перерасчёт и возврат — [условия и срок]. Спасибо за этот период. Если захочешь вернуться — напиши, помогу с восстановлением. — Тон уважительный: человек может вернуться']]},
      {t:'kv', rows:[['13. «Принял в работу»','Принял, уточняю. Ответ будет до [время/дата]. — Короткий ответ лучше молчания'], ['14. Похвала','Кстати, [что именно] — сильно. Редко кто так делает с первого раза 👍 — Хвалим за конкретное действие, а не «молодец»']]},
      {t:'h2', id:'s-8-как-отказывать-и-как-хвалить', text:'8. Как отказывать и как хвалить'},
      {t:'kv', rows:[['Отказ','Формула: понимаю → причина → альтернатива → следующий шаг. — «Понимаю, что хочется быстрее. Перенести дату нельзя — экзамен общий для потока. Но можно сдать в дополнительный день [дата]. Оформляю?»'], ['Похвала','За конкретное действие, сразу, коротко. Не «молодец», а «сдал на неделю раньше — так держать». — Мотивация сильнее от конкретики, чем от оценки'], ['Плохие новости','Готовим студентов заранее, не в последний день. Всегда: факт, причина, что можно сделать. — Неожиданное «вас отчисляют» = жалоба и скандал']]},
    ]
  },
  {
    id: 'shablony',
    title: 'Шаблоны сообщений',
    eyebrow: 'ОБЩЕНИЕ',
    desc: '14 готовых сообщений студентам и родителям — с кнопкой копирования.',
    blocks: [
      {t:'p', text:'Кнопка «Скопировать» копирует текст без разметки. Переменные в { } замените на свои.'},
      {t:'important', title:'Кто проверяет', text:'Спорные формулировки — отказ, долг, отчисление — согласуйте с руководителем до отправки.'},
      {t:'msg', title:'1. Приветствие (первый контакт)', text:'Привет, [имя]! Меня зовут [имя куратора], я буду твоим куратором на протяжении всего обучения. По всем вопросам, связанным с учёбой и доступами, ты можешь обращаться ко мне. Моя задача — помочь тебе, а не ругать и не проверять тебя. Уверен, что твоё обучение пройдёт замечательно!\n\nЯ добавлю тебя в чат группы [код группы] — там все анонсы и дедлайны.'},
      {t:'msg', title:'2. Приглашение на установочную встречу', text:'Привет, [имя]! [дата] в [время] проведём установочную встречу группы — обязательно будь.\nРазберём: как устроено обучение, где что лежит на платформе, как сдавать домашки, кто я и как со мной связываться.\nСсылка: [ссылка]. Зайти лучше за 5 минут и проверить звук.'},
      {t:'msg', title:'3. Напоминание о встрече', text:'Привет! Напоминаю: встреча сегодня в [время], ссылка та же — [ссылка]. Если не получается — напиши, разберём отдельно.'},
      {t:'msg', title:'4. Напоминание об оплате (за 15 дней)', text:'Привет, [имя]! Напоминаю: до [дата] нужно закрыть оплату за [период], сумма [сумма]. Реквизиты и ссылка: [ссылка]. После оплаты пришли, пожалуйста, чек — я приложу к твоей карточке.'},
      {t:'msg', title:'5. Просрочка оплаты', text:'Привет, [имя]! Оплата за [период] не пришла — сейчас числится долг [сумма]. Оплати, пожалуйста, до [дата] и пришли чек. Если есть сложности со сроком — напиши, обсудим график.'},
      {t:'msg', title:'6. Просьба прислать документы', text:'Привет, [имя]! Для [справки / договора / зачёта] нужны: [список]. Пришли, пожалуйста, фото или PDF до [дата]. Если чего-то нет — напиши, подскажу, где взять.'},
      {t:'msg', title:'7. Не пришёл на встречу', text:'Привет, [имя]! Тебя не было на встрече — всё в порядке? Запись здесь: [ссылка]. Если что-то непонятно по теме — напиши, разберём один на один.'},
      {t:'msg', title:'8. «Не понял материал / тяжело»', text:'Привет, [имя]! Это нормально — [тема] сложная, через неё проходят почти все. Давай так: пришли, что именно непонятно, я подберу материал или попрошу преподавателя разобрать на консультации. Могу созвониться завтра в [время] на 15 минут — подойдёт?'},
      {t:'msg', title:'9. Ответ на претензию', text:'Привет, [имя]! Понял тебя, ситуация неприятная — извини за это. Что делаю: [действие], разберусь и напишу тебе до [дата/время]. Если нужно быстрее — позвони мне: [телефон].'},
      {t:'msg', title:'10. Сообщение родителю (согласие получено)', text:'[Имя Отчество], здравствуйте! Я куратор группы [код], меня зовут [имя]. Пишу по поводу [имя студента]: [факты с датами]. С нашей стороны: [что уже сделали]. Что важно от вас: [просьба]. Давайте созвонимся [дата] в [время] — мой телефон [телефон].'},
      {t:'msg', title:'11. Предупреждение о риске отчисления', text:'Привет, [имя]! Пишу прямо: накопилось [пропуски / долг / несданные работы], и это ставит под риск обучение. Варианты: [1) …, 2) …]. Скажи до [дата], какой выбираешь — я помогу оформить. Я на твоей стороне, но правила одинаковы для всех.'},
      {t:'msg', title:'12. Уведомление об отчислении', text:'Привет, [имя]! По [основание] обучение прекращается с [дата]. Что нужно сделать: [документы]. Перерасчёт и возврат — [условия и срок]. Спасибо за этот период. Если захочешь вернуться — напиши, помогу с восстановлением.'},
      {t:'msg', title:'13. «Принял в работу»', text:'Принял, уточняю. Ответ будет до [время/дата].'},
      {t:'msg', title:'14. Похвала', text:'Кстати, [что именно] — сильно. Редко кто так делает с первого раза 👍'},
    ]
  },
  {
    id: 'brand',
    title: 'Бренд и оформление',
    eyebrow: 'ОФОРМЛЕНИЕ',
    desc: '1. Что скачать перед любой работой',
    blocks: [
      {t:'p', text:'Гайдлайн колледжа: палитра, шрифты, шапка, таблицы, презентации. Что скачать и чего не делать.'},
      {t:'h2', id:'s-1-что-скачать-перед-любой-работой', text:'1. Что скачать перед любой работой'},
      {t:'kv', rows:[['Гайдлайн оформления','Полные правила: палитра, шрифты, шапка, таблицы, презентации, отчёты, «чего не делать».\nhttps://docs.google.com/document/d/1YbhFtS4gmsixiYqvaXsTWydJ-Hfs6-Mc/edit — PDF-версию и этот файл — в папку «База знаний/Артефакты»'], ['Лукбук','Визуальные примеры: как выглядят макеты, шапки, карточки и слайды в фирменном стиле.\nhttps://drive.google.com/file/d/1HpY9vog211X2gbdA2P1_1UB9TqssE3ss/view — Смотреть перед сборкой презентации'], ['Логотип','Чёрный логотип PNG для шапки и колонтитулов.\nhttps://drive.google.com/file/d/1ZqG8bPvv7gw-kw5zGwb6l-YHN9oGGn8n/view — Не перекрашивать и не растягивать'], ['Порядок работы','Сначала открываешь эти три файла, потом делаешь презентацию, справку, отчёт или анонс. — Эта вкладка — выжимка; при расхождении главнее гайдлайн']]},
      {t:'h2', id:'s-2-палитра-hex', text:'2. Палитра (HEX)'},
      {t:'kv', rows:[['Основной чёрный  #1C1C1E','Заголовки таблиц, плашка даты, основной текст, логотип.'], ['Фирменный синий  #6F8FF0','Левая полоса карточек, начало градиента шапки, маркеры списков, подчёркивание ссылок.'], ['Светлый синий  #C8D4F8','Обводка обычных карточек, конец градиента шапки, линия над колонтитулом.'], ['Акцентный лайм  #EEFF6B','Кнопки, бейдж-статус, выделение важного. Всегда с чёрной обводкой 1 px.'], ['Подложка  #F3F4F7','Фон страницы, нижние инфоблоки, боковая колонка таблицы.'], ['Нейтральная карточка  #F1F2F4','Вторичные блоки: асинхронные, справочные.']]},
      {t:'kv', rows:[['Серая обводка  #9AA0AB','Пунктирные границы вторичных блоков.'], ['Белый  #FFFFFF','Фон основных карточек, текст на чёрном.'], ['Второстепенный текст  #5B6170','Подписи, сноски, мелкий серый текст.'], ['Пропорции','70% белого и светло-серого, 20% чёрного и синего, не больше 10% лайма. — Лайм означает «действие» или «внимание» и не заливает большие площади']]},
      {t:'h2', id:'s-3-шрифты-и-размеры', text:'3. Шрифты и размеры'},
      {t:'kv', rows:[['Гарнитура','Геометрический гротеск без засечек, один на весь документ: Onest, Manrope, Montserrat. Запасной — Arial. — Не смешивать два шрифта'], ['H1 — заголовок документа','32–40 pt, ExtraBold, #1C1C1E'], ['H2 — раздел','22–26 pt, Bold, #1C1C1E'], ['H3 — подраздел','16–18 pt, Bold, #1C1C1E'], ['Надзаголовок (капс)','11–12 pt, Bold, разрядка +5% — Только для надзаголовков и служебных ярлыков'], ['Основной текст','11–12 pt, Regular, #1C1C1E']]},
      {t:'kv', rows:[['Подпись, сноска','9–10 pt, Regular, #5B6170'], ['Интерлиньяж и выравнивание','1,4–1,5; по левому краю, без выключки по ширине. — Курсив не используем']]},
      {t:'h2', id:'s-4-шапка-и-логотип', text:'4. Шапка и логотип'},
      {t:'kv', rows:[['Шапка','Плашка на всю ширину контента, радиус 28 px, градиент от #6F8FF0 слева к почти белому справа.'], ['Что внутри','Надзаголовок капсом (название организации) → заголовок 32–40 pt → подзаголовок через « · »: специальность, база, группы.'], ['Правая часть шапки','Чёрная плашка с датой или периодом (радиус 16, белый Bold 20–24 pt) и лаймовый бейдж под ней (радиус 12, чёрный Bold 11–12 pt). — Например: «Неделя 11 · время московское»'], ['Логотип на титуле','Левый верхний угол шапки или правый верхний над плашкой с датой.'], ['Логотип внутри документа','В колонтитуле каждой страницы и на каждом слайде: высота 8–10 мм, в презентации 5–6% высоты слайда. — Обязательно на каждой странице многостраничного документа'], ['Охранное поле','Не меньше высоты буквы «Ц» из слова «ЦИФРОВОЙ».']]},
      {t:'kv', rows:[['Фон под логотипом','Белый или очень светлый; на градиенте — только на светлой части.']]},
      {t:'h2', id:'s-5-таблицы-и-карточки', text:'5. Таблицы и карточки'},
      {t:'kv', rows:[['Принцип','Таблица собрана из карточек, а не из линий сетки.'], ['Строка-заголовок','Отдельные чёрные плашки, радиус 12, по одной на колонку, зазор 8–10 px, белый Bold 13–14 pt.'], ['Боковая колонка','Серая плашка #F3F4F7, радиус 12: номер или название жирным, ниже мелкое уточнение.'], ['Ячейка','Белая карточка, радиус 14, обводка #C8D4F8, левая синяя полоса 5–6 px; название SemiBold 12–13 pt. — Расстояние между карточками 8–10 px, внутренние отступы 14–16 px'], ['Пустая ячейка','Очень светлый серый #F7F8FA, без обводки и текста.'], ['Нельзя','Линии сетки, зебра, вертикальные разделители, разные ширины колонок, разные высоты ячеек в строке.']]},
      {t:'h2', id:'s-6-презентации', text:'6. Презентации'},
      {t:'kv', rows:[['Формат','16:9, фон белый или #F3F4F7.'], ['Обложка','Повторяет шапку на весь экран: градиент, логотип, название, чёрная плашка с датой, лаймовый бейдж.'], ['Внутренний слайд','Заголовок H2 28–36 pt слева сверху, уменьшенный логотип в углу, контент в карточках.'], ['Правило','Один слайд — одна мысль: 2–4 карточки, не больше 5–6 строк текста.'], ['Акцентный слайд','Чёрный фон #1C1C1E, белый текст, лаймовая цифра или ключевое слово. — Для вывода, цифры, цитаты'], ['Метрики','48–72 pt ExtraBold в белой карточке с синей полосой, подпись мелко серым.']]},
      {t:'kv', rows:[['Диаграммы','Синий, чёрный, серый; лайм только для главного показателя; подписи на графике, без тяжёлых легенд и сеток.']]},
      {t:'h2', id:'s-7-документы-отчёты-справки', text:'7. Документы, отчёты, справки'},
      {t:'kv', rows:[['Титул','Шапка по правилам раздела 4 с логотипом.'], ['Колонтитул','Слева уменьшенный логотип, справа название документа и номер страницы мелким серым, сверху линия #C8D4F8 1 px.'], ['Таблицы данных','По правилам раздела 5; итоговая строка — светло-серый фон и жирный шрифт.'], ['Выводы и рекомендации','Блок «Важно» или чёрная плашка с белым текстом.'], ['Поля страницы','15–20 мм, всё выровнено по единой сетке.']]},
      {t:'h2', id:'s-8-чего-не-делать', text:'8. Чего не делать'},
      {t:'kv', rows:[['Цвета вне палитры','Красный, оранжевый, зелёный, фиолетовый — нельзя.'], ['Лайм','Не заливать целые страницы и большие блоки.'], ['Эффекты','Никаких теней, градиентов вне шапки, 3D. — Глубину дают обводка и цветная полоса'], ['Углы','Все блоки со скруглением, острых углов нет.'], ['Шрифты','Не смешивать несколько гарнитур.'], ['Логотип','Не растягивать, не перекрашивать, не закрывать другими элементами.']]},
      {t:'kv', rows:[['Плотность','Не перегружать страницу: воздух между блоками обязателен.'], ['Выделение','Не использовать курсив, красный цвет и несколько способов выделения одновременно.']]},
      {t:'h2', id:'s-9-чек-лист-перед-отправкой', text:'9. Чек-лист перед отправкой'},
      {t:'kv', rows:[['1','Логотип есть на титуле и в колонтитулах каждой страницы или слайда.'], ['2','Шрифт один, размеры по уровням, интерлиньяж 1,4–1,5.'], ['3','Цвета только из палитры, лайма не больше 10%.'], ['4','Таблицы собраны из карточек, линий сетки нет.'], ['5','Скругления везде, теней нет.'], ['6','Текст по левому краю, без выключки.']]},
      {t:'kv', rows:[['7','Открыл на телефоне: текст читается, ничего не обрезано. — Анонсы и презентации смотрят с телефона']]},
    ]
  },
  {
    id: 'zadachnik',
    title: 'Задачник',
    eyebrow: 'РАБОТА ОТДЕЛА',
    desc: '1. Главное правило отдела',
    blocks: [
      {t:'p', text:'Как ставить задачу и как её закрывать: результат, этапы, таблица с данными.'},
      {t:'h2', id:'s-1-главное-правило-отдела', text:'1. Главное правило отдела'},
      {t:'kv', rows:[['Всё в задачник','Любая задача и любой процесс ведутся только в задачнике. Сообщение в чате или «сказали на словах» задачей не считается. — Без записи в задачнике работы не существует'], ['Зачем','Видно, что сделано, кем и когда; ничего не теряется при передаче группы; по студенту собирается полная история.'], ['Что считается задачей','Любое действие с проверяемым результатом: выдать доступы, собрать документы, провести встречу, закрыть долг, обзвонить родителей.'], ['Что не считается','«Уточнить», «позвонить и узнать», «посмотреть» — это этапы внутри задачи, отдельными задачами не заводим.']]},
      {t:'h2', id:'s-2-как-поставить-задачу', text:'2. Как поставить задачу'},
      {t:'kv', rows:[['1. Название','Глагол + объект + группа или студент: «Выдать доступы студентам 26_01». — Плохо: «Разобраться с доступами»'], ['2. Что ожидается в результате','Проверяемый итог, а не процесс: «Все 10 студентов вошли на платформу, в журнале отметка по каждому». — Должно быть видно, как проверить'], ['3. Этапы выполнения','2–5 шагов по порядку; по каждому понятно, что делаем и когда.'], ['4. Срок','Дата или SLA из «Карты процессов» (ответ 2 часа, справка 3 дня, доступы — 2 дня). — Код процесса указываем в задаче'], ['5. Исполнитель','Один ответственный человек, а не «отдел кураторов».'], ['6. Где данные','Ссылка на таблицу, папку или раздел базы знаний, где ведётся работа.']]},
      {t:'kv', rows:[['7. Связь с процессом','Код процесса из «Карты процессов»: 2.4, 3.5, [[problemy#p4-1|4.1]] и т. д. — Так видно, по какому регламенту работаем'], ['Пример целиком','Название: «Выдать доступы студентам 26_01».\nОжидается: все 10 студентов входят в студенческую платформу и видят расписание.\nЭтапы: 1) собрать логины из «Реестра доступов»; 2) выдать каждому лично; 3) подтвердить вход; 4) отметить в журнале учёта.\nСрок: 2 рабочих дня. Где данные: «Реестр доступов», журнал учёта. Процесс: 2.4. — Это тот же пример, что вы приводили']]},
      {t:'h2', id:'s-3-как-закрыть-задачу', text:'3. Как закрыть задачу'},
      {t:'kv', rows:[['Обязательно','К закрытию предложить таблицу (или файл), где зафиксирован результат и все изменения. — Главное требование: не «сделано», а данные'], ['Что в таблице','Все студенты или объекты, статус по каждому, что именно изменено, какие данные появились. — Одна строка на человека, если задача про студентов'], ['Ссылку — в задачу','Приложить ссылку на эту таблицу в задаче, чтобы результат не потерялся.'], ['Что менял','Указать конкретно: «в реестре доступов добавлены коды 10 студентам», «в журнале оплат закрыт ноябрь у 3 студентов».'], ['Итог','1–2 строки в комментарии: что получилось, что не получилось и почему.'], ['Если выполнено не полностью','Задачу не закрываем: создаём подзадачу на остаток или переносим срок с причиной.']]},
      {t:'h2', id:'s-4-когда-задача-считается-невыполненной', text:'4. Когда задача считается невыполненной'},
      {t:'kv', rows:[['Нет данных','«Сделал» без таблицы и цифр — задача возвращается исполнителю.'], ['Нет подтверждения','Студент не подтвердил вход или получение, отметки в журнале нет.'], ['Пропущен этап','Например, доступы выданы, но в журнале не отмечено.'], ['Срок истёк без причины','Задача остаётся открытой и попадает в недельную сводку руководителю (процесс [[soprovozhdenie#p3-11|3.11]]).']]},
      {t:'h2', id:'s-5-дисциплина', text:'5. Дисциплина'},
      {t:'kv', rows:[['Каждый день','Просмотреть свои задачи, обновить статусы по этапам. — 5 минут утром и 5 вечером'], ['Каждую неделю','Сдать незакрытые задачи с причиной и планом — идут в недельную сводку.'], ['Передача группы','Все открытые задачи переоформляются на нового куратора, с результатом и ссылками на данные. — Ничего не остаётся «в голове»'], ['Архив','Закрытые задачи не удаляем: это история по группе и по студенту.']]},
      {t:'h2', id:'s-6-связь-с-базой-знаний', text:'6. Связь с базой знаний'},

  {

    desc: '1. Что это и зачем',
    blocks: [
      {t:'p', text:'Проверка знаний на кураторских встречах: рубрика К1–К4, вопросы-крючки, зонды, отчётность.'},
      {t:'h2', id:'s-1-что-это-и-зачем', text:'1. Что это и зачем'},
      {t:'kv', rows:[['Назначение','Раз в неделю куратор на встрече проверяет реальное понимание предмета студентом по 4 критериям. Результат — балл 0–12, процент и отметка риска. — Это диагностика, а не оценка для журнала'], ['Где живёт','«Рабочая тетрадь кураторов» (Google Таблица): журнал оценки на каждую группу, рубрика, ростер и явка, дашборд, сводная по предметам. — ID в «Реестре ресурсов»: О-01 — О-09'], ['Кто делает','Куратор. Старший куратор смотрит дашборд раз в неделю.'], ['Сколько времени','2–3 минуты на студента: 1 вопрос-крючок + до 2 коротких зондов. — Из рубрики'], ['Зачем','Чтобы видеть пробелы по предметам и студентов, которые «тянут» только на пересказе, пока это не стало долгами и отчислением. — Главный источник ранних сигналов']]},
      {t:'h2', id:'s-2-недельный-цикл', text:'2. Недельный цикл'},
      {t:'kv', rows:[['1. Предмет недели','Темы ротируются: нечётная и чётная неделя, отдельный набор для 9 кл и 11 кл. — Лист «Предметы и циклы», пример ротации на сентябрь'], ['2. Подготовка','Открыть платформу: работы и оценки студента за неделю. — Вопрос-крючок строится на реальной ситуации'], ['3. Встреча','Каждому студенту — 1 вопрос-крючок по его работе + до 2 зондов по остальным критериям. — Раздел 5'], ['4. Запись','Сразу после встречи — строка в журнал группы: дата, предмет, ФИО, К1–К4. — Одна строка = один ответ по одному предмету'], ['5. Риск','Итог ниже 5 из 12 — отметка «риск», студент уходит в журнал проблемных (процесс [[problemy#p4-1|4.1]]). — Порог из рубрики'], ['6. Сводка','Раз в неделю: дашборд + предметы ниже 5 → что обсудить с преподавателем. — Идёт в недельную сводку (процесс 3.11)']]},
      {t:'h2', id:'s-3-рубрика-4-критерия-по-0-3-балла', text:'3. Рубрика: 4 критерия по 0–3 балла'},
      {t:'kv', rows:[['К1. Фактическое знание','0 — не знает факты/термины; 1 — знает отдельные, путается; 2 — знает материал, мелкие неточности; 3 — уверенно владеет. — Максимум 3'], ['К2. Понимание логики','0 — не объясняет «почему»; 1 — частично объясняет причину; 2 — объясняет с небольшой помощью; 3 — сам объясняет причинно-следственные связи. — Максимум 3'], ['К3. Применение / перенос','0 — не может применить к новому примеру; 1 — только по прямой аналогии; 2 — применяет с подсказкой; 3 — уверенно переносит на новый пример. — Максимум 3'], ['К4. Самостоятельность формулировки','0 — дословно повторяет текст урока; 1 — в основном пересказ; 2 — в основном своими словами; 3 — полностью своими словами, свободно. — Максимум 3'], ['Итог','Сумма К1–К4: 0–12. Риск при итоге ниже 5. — Ниже 5 — сигнал, а не приговор'], ['Важное правило','0 по критерию — это чаще «не спросили», а не «не знает». Поэтому есть обязательные зонды. — Иначе все оценки съезжают в 0 по К2–К3']]},
      {t:'h2', id:'s-4-шаг-1-вопрос-крючок-по-ситуации-на-пла', text:'4. Шаг 1: вопрос-крючок по ситуации на платформе'},
      {t:'kv', rows:[['Несколько попыток / пересдача','«Ты сдал [работа] с [N]-й попытки — что не получилось в первый раз и что поменял?» — Даёт материал по логике и осознанию ошибки'], ['Высокая оценка с первого раза','«Отлично сделал [работа] — а если бы [условие] было другим, что поменялось бы в решении?» — Проверка: это понимание или удача/списывание'], ['Низкая оценка или не сдано','«По [работа] пока не получилось — с чего начинал, в каком месте застрял?» — Диагностика пробела, без давления'], ['Тема прошла, работа не сдана','«Своими словами: в чём была главная идея [темы]?» — Самостоятельность формулировки'], ['Проверка на заучивание','«Объясни это так, будто объясняешь однокурснику, который только начал разбираться» — Отличает пересказ от понимания'], ['Связь с предыдущей темой','«Как то, что проходили на прошлой неделе про [X], связано с [текущей темой]?» — Применение и интеграция']]},
      {t:'kv', rows:[['Рефлексия над ошибкой','«Если бы делал эту работу заново — что бы изменил?» — Логика и самокритика'], ['Короткий или неуверенный ответ','«А что конкретно было непонятно вот в этом месте?» — Углубляем текущий критерий, новый не открываем']]},
      {t:'h2', id:'s-5-шаг-2-обязательные-зонды-задаются-всег', text:'5. Шаг 2: обязательные зонды (задаются всегда)'},
      {t:'kv', rows:[['К1, если термин не прозвучал','«Как называется метод или понятие, которое ты использовал? Объясни своими словами»'], ['К2, всегда','«Почему ты сделал именно так, а не иначе? Что было бы, если убрать этот шаг?» — 15–20 секунд'], ['К3, всегда','«А если бы данные или условие были другими — что изменилось бы в решении?» — Вариацию куратор придумывает на ходу'], ['К4, без вопроса','Оценивается по манере всех ответов: своими словами или пересказ заученного. — Слушаем, а не спрашиваем']]},
      {t:'h2', id:'s-6-как-заполнять-журнал', text:'6. Как заполнять журнал'},
      {t:'kv', rows:[['Лист на группу','«Оценка 26-01», «Оценка 26-02», «Оценка 26-11» — по одному листу на группу. — Новая группа — копия листа'], ['Колонки','Дата · Неделя · Предмет · Цикл · ФИО · Работа на платформе · Оценка на платформе · К1 · К2 · К3 · К4 · Итог · % — Итог и % считаются формулой'], ['Формулы','Копировать вниз из строки-примера (строка 5). — В тетради это указано в шапке'], ['ФИО','Всегда полностью и так же, как в «Составах групп». — Иначе дашборд и срез не склеят данные'], ['Нет оценки на платформе','Ставить «—», а не 0. — 0 — это реальная двойка, он попадёт в статистику'], ['Несколько предметов','Отдельная строка на каждый предмет в один день.']]},
      {t:'kv', rows:[['Пустая строка','Не оставлять строки с датой и итогом без ФИО и критериев. — Итог 0 в пустой строке ломает средний балл']]},

      {t:'kv', rows:[['Дашборд группы','Средний балл (0–12 и %), количество оценок, отметки «риск», средняя явка. — Лист «Дашборд»'], ['Сводная по предметам','Средний балл и охват по каждому предмету; предметы ниже 5 подсвечены. — Лист «Сводная по предметам»'], ['На что смотреть','1) Предметы ниже 5 → разговор с преподавателем. 2) Студенты с риском → 4.1. 3) Низкий охват (мало оценок) → сбился график встреч. — Три вывода в неделю, не больше'], ['Чего не делать','Не сравнивать группы по абсолютному баллу, если охват разный: 1 оценка на 26-11 — это не статистика. — Сначала охват, потом качество']]},
      {t:'h2', id:'s-8-что-поправить-в-рабочей-тетради-нашёл', text:'8. Что поправить в «Рабочей тетради» (нашёл при разборе)'},
      {t:'kv', rows:[['Пустой лист «Инструкция»','Лист есть, текста нет. Перенести туда разделы 1–6 этой вкладки. — Самое важное исправление'], ['Пустой лист «Срез · дашборд»','Дублирует «Дашборд». Удалить или наполнить. — Сейчас висит пустым'], ['Циклы не совпадают','В «Предметах и циклах» Русский язык — «Соцгум», в журнале 26-01 — «Гуманитарный». У Математики цикл не указан. — Дашборд по циклам считает неверно'], ['Неполные ФИО','«Стойков», «Тимашев» без имени; «Сагирова Данир» вместо «Сагиров Данир»; «Головин Александр Дмитриевич» и «Головин Александр» — один человек. — Ломает агрегацию по студенту'], ['Студент не в своей группе','Бариев Руслан в составе «№3 26-02», но его строки лежат в журнале 26-01. — Проверить и перенести'], ['Явка не заполнена','У 26-02 и 26-11 в «Составах групп» не отмечена явка — в дашборде 0%. — Средняя явка недостоверна']]},
      {t:'kv', rows:[['Пустая строка с итогом 0','В журнале 26-11: только дата 22.10 и итог 0. — Удалить строку'], ['10 студентов на подгруппу','В тетради подгруппы по 10 человек, в базе знаний группа — до 25. — Определиться: 26-01 = 2 подгруппы по 10? Отразить в процессе 1.5'], ['Группа №6 без данных','Есть заголовок, нет состава и кода группы. — Удалить или заполнить'], ['Преподаватели не заполнены','В «Сводной по предметам» колонка «Преподаватель» пустая. — Заполнить один раз — дальше сводка сама']]},
      {t:'h2', id:'s-9-связь-с-другими-процессами', text:'9. Связь с другими процессами'},
      {t:'kv', rows:[['1.5 Распределение по группам','Код группы 26_01; внутри — подгруппы №1, №2 по 10 человек. — Нужно свести с правилом «до 25»'], ['3.1 Кураторские встречи','Оценка знаний — часть встречи, а не отдельное мероприятие. — Шаги обновлены'], ['3.3 Пропуски и посещаемость','Явка берётся из «Составов групп» по неделям.'], ['3.11 Отчётность куратора','Дашборд — источник цифр для недельной сводки руководителю.'], ['4.1 Проблемные студенты','Итог ниже 5 или К3 = 0 → сигнал в журнал проблемных.'], ['2.6 Паспорт мышления','Наблюдения со встреч (как думает, что даётся тяжело) идут в паспорт.']]},

      {t:'kv', rows:[['Название','База знаний отдела кураторов — Рабочее название, можно поменять'], ['Задача','Один источник правды: любой куратор находит ответ за 1 минуту и делает по одному стандарту. — Сейчас знания живут в головах и в переписке'], ['Что внутри','42 процесса в 5 разделах, библиотека шаблонов сообщений, чек-листы, глоссарий, правила Tone of voice. — Каждая вкладка — отдельный слой базы'], ['Чего внутри нет','Персональные данные студентов, приказы и договоры (они на Диске в папках), финансовые документы. — Ссылки на них — есть, сами данные — нет']]},
      {t:'h2', id:'s-2-для-кого-и-какие-сценарии-закрывает', text:'2. Для кого и какие сценарии закрывает'},
      {t:'kv', rows:[['Новый куратор','Маршрут первой недели: 7 базовых процессов, шаблоны, чья помощь. — Главный потребитель базы'], ['Куратор в работе','Быстрый поиск по ситуации: «студент пропал», «просит справку», «не платит». — Поиск по коду процесса и по словам'], ['Старший куратор','Единый стандарт проверки, разбор ошибок, наставничество. — Чек-листы = критерии качества'], ['Руководитель','Прозрачность: что реально происходит, где узкие места, где нужны люди. — Цифры недели + журнал обращений']]},
      {t:'h2', id:'s-3-принципы-базы-знаний', text:'3. Принципы базы знаний'},
      {t:'kv', rows:[['1','Один процесс = одна страница с одним кодом. — Коды 1.1–5.4 не меняются никогда'], ['2','Пишем как есть, а не как должно быть по-хорошему. — Костыли и обходные пути тоже описываем'], ['3','Каждый процесс заканчивается проверяемым критерием «готово». — Без «поговорили и всё»'], ['4','К каждому частому сообщению есть шаблон. — Чтобы не изобретать формулировки в стрессе'], ['5','У каждого раздела есть владелец. — Иначе база умирает за квартал'], ['6','Одна информация — в одном месте. — Остальные ссылаются, а не копируют']]},
      {t:'h2', id:'s-4-структура-итоговой-базы-5-слоёв', text:'4. Структура итоговой базы (5 слоёв)'},
      {t:'kv', rows:[['Слой 1. Карта процессов','42 процесса, навигация по всей базе. — То, что уже готово'], ['Слой 2. Страницы процессов','По одной странице на каждый код: цель, шаги, шаблоны, исключения. — Собираются из этой таблицы автоматически'], ['Слой 3. Библиотека артефактов','Чек-лист приёмки, шаблоны сообщений, бланки заявлений, шаблоны справок, протоколы встреч. — Папка на Google Диске: «База знаний кураторов / Артефакты»'], ['Слой 4. Глоссарий','20 терминов отдела, чтобы новый человек понимал язык. — Вкладка «Глоссарий»'], ['Слой 5. Владельцы и изменения','Кто отвечает за раздел, когда последний раз проверяли, что менялось. — Журнал изменений — нужно завести']]},
      {t:'h2', id:'s-5-шаблон-страницы-процесса-7-блоков', text:'5. Шаблон страницы процесса (7 блоков)'},
      {t:'kv', rows:[['1. Зачем','Результат в одной фразе: что должно быть на выходе. — Колонка D'], ['2. Когда','Триггер — событие, после которого процесс стартует. — Колонка E'], ['3. Кто','Роль-исполнитель и кому эскалируем. — Колонки G и L'], ['4. Шаги','Пронумерованные шаги с точными формулировками и сроками. — Колонка F + H'], ['5. Шаблоны и системы','Что берём готовое и где это лежит. — Колонки I и J'], ['6. Критерий «готово»','Как проверить, что сделано правильно. — Колонка K']]},
      {t:'kv', rows:[['7. Исключения','Что делать, если пошло не по стандарту. — Колонка L']]},
      {t:'h2', id:'s-6-маршрут-новичка-на-первую-неделю', text:'6. Маршрут новичка на первую неделю'},
      {t:'kv', rows:[['День 1','Читает «Карту процессов» + ToV. Получает доступы. Смотрит 2 записи встреч в Толке. — Не пытается выучить всё'], ['День 2','Делает приёмку 3 студентов под присмотром наставника (п. 1.1, [[priem#p1-2|1.2]]). — Проверяем данные, а не скорость'], ['День 3','Пишет первое приветствие и создаёт чат группы (п. [[priem#p1-3|1.3]]) по шаблону. — Наставник читает сообщение до отправки'], ['День 4','Отвечает на вопросы студентов по ToV, разбирает 5 ситуаций из шаблонов. — Отрабатываем формулировки'], ['День 5','Ведёт свою группу самостоятельно, вечером — разбор ошибок с наставником. — Итог: чек-лист недели закрыт']]},
      {t:'h2', id:'s-7-на-чём-всё-живёт-системы', text:'7. На чём всё живёт (системы)'},
      {t:'kv', rows:[['Google Диск','Документы, шаблоны, папки студентов и чек-листы. — https://drive.google.com/drive/folders/1UXtAoqdPX1edgWh5IUUlUe70FFmyKieG — корень «Отдел кураторов», 22 папки (см. «Реестр ресурсов», раздел 1)'], ['Эта таблица','Карта процессов, глоссарий, журналы учёта/оплат/обращений. — Источник правды по процессам'], ['Платформа колледжа','Задачи, цели месяца, реестр документов, финансы. — Там, где нужны сроки и контроль'], ['Студенческая платформа','Данные студентов в учёте (app.rameevcollege.ru). — app.rameevcollege.ru; доступы студентов — в «Реестре доступов» (Т-03)'], ['Контур.Толк','Встречи, записи, транскрипты, чаты. — Сюда же ложатся разборы встреч'], ['Агенты-помощники','Напоминания о дедлайнах, сводки по посещаемости и долгам, черновики ответов. — Работают по этим же регламентам, поэтому база должна быть точной']]},
      {t:'h2', id:'s-8-управление-и-поддержка', text:'8. Управление и поддержка'},
      {t:'kv', rows:[['Владелец раздела','Куратор-эксперт по теме: отвечает за актуальность и вносит правки. — Назначается на каждый из 5 разделов'], ['Изменения','Сначала правим базу, потом меняем работу. Правка = дата + кто. — Без этого процессы разъезжаются'], ['Ревью','Раз в квартал: что устарело, что не используется, что добавить. — 30 минут на раздел'], ['Ошибки','Каждая ошибка — повод улучшить процесс, а не наказать человека (п. [[otdel#p5-3|5.3]]). — Журнал ошибок и улучшений']]},
      {t:'h2', id:'s-9-этапы-внедрения', text:'9. Этапы внедрения'},
      {t:'kv', rows:[['Этап 1 (1–2 недели)','Приём + онбординг: [[priem#p1-1|1.1]]–1.5, 2.1, 2.2, [[onboarding#p2-7|2.7]] + ToV + чек-лист приёмки + шаблоны сообщений. — Закрывает 70% ежедневной работы куратора'], ['Этап 2 (2 недели)','Сопровождение: [[soprovozhdenie#p3-1|3.1]]–[[soprovozhdenie#p3-7|3.7]] + журнал посещаемости и оплат. — Появляются цифры для отчётности'], ['Этап 3 (2 недели)','Проблемы и отчисления: [[problemy#p4-1|4.1]]–[[problemy#p4-4|4.4]] + протоколы встреч. — Снимает главные конфликты'], ['Этап 4 (дальше)','Новые процессы (переводы, отпуска, выпуск), раздел 5 «Работа отдела», автоматизация напоминаний и сводок. — Автоматизируем только то, что уже описано']]},
      {t:'h2', id:'s-10-метрики-успеха', text:'10. Метрики успеха'},
      {t:'kv', rows:[['Выход нового куратора','5 рабочих дней до самостоятельной работы. — Сейчас — «как получится»'], ['Шаблоны','100% частых сообщений из библиотеки, а не из головы. — 14 шаблонов уже есть'], ['Скорость ответа','95% сообщений студентов — ответ до 2 часов в рабочее время. — Замер по переписке раз в месяц'], ['Оплаты','80%+ оплат закрыты до 5 числа. — Считается по журналу оплат'], ['Повторные вопросы','Снижение числа одинаковых вопросов новичков. — По журналу ошибок и чату отдела']]},
      {t:'h2', id:'s-11-риски-и-как-их-снимаем', text:'11. Риски и как их снимаем'},
      {t:'kv', rows:[['База устаревает','У каждого раздела владелец + ревью раз в квартал. — Без владельцев база мертва через 3 месяца'], ['Персональные данные','В базе — только процессы и шаблоны, данные студентов — в отдельных папках с доступом по ролям. — Особенно важно: паспорта, СНИЛС, аттестаты'], ['Знание в головах','Записываем «как есть», включая обходные пути и исключения. — Идеальные регламенты бесполезны']]},
      {t:'h2', id:'s-12-что-нужно-от-вас-чтобы-финализировать', text:'12. Что нужно от вас, чтобы финализировать концепцию'},
      {t:'kv', rows:[['1. Сроки','Подтвердить или поправить SLA: в таблице они помечены как черновик (ответ 2 часа, справка 3 дня, уведомление об отчислении и т. п.). — Самое важное — без цифр нет контроля'], ['2. Договор','Прислать условия: за сколько дней уведомляем об отчислении, что возвращаем при отказе. — Пункты 1.7 и 4.4'], ['3. Шаблоны','Справки, приглашение на встречу, скрипт звонка родителю, бланк заявления. — Пришлёте — соберу библиотеку'], ['4. Владельцы','Кто отвечает за разделы 1–5 (можно по одному человеку на 2 раздела). — Нужно до запуска'], ['5. Системы','Где источник истины по студентам: платформа, студенческая платформа или таблица? Что ведём параллельно и почему. — Сейчас данные живут в нескольких местах'], ['6. Согласие родителей','Как юридически оформляем согласие на контакт (форма, кто подписывает, где храним). — Пункт 2.9']]},
      {t:'kv', rows:[['7. Формат','Где живёт итоговая база: Google Диск, платформа колледжа или отдельная вики. — Скажете — соберу в этом формате'], ['8. Новые процессы','Проверить 11 процессов, которые я добавил (1.6, 1.7, 2.8, 2.9, [[soprovozhdenie#p3-8|3.8]]–3.11, 4.5, 4.6, [[otdel#p5-1|5.1]]–[[otdel#p5-4|5.4]]): нужны или нет. — Они помечены статусом «новый»']]},
      {t:'h2', id:'s-13-что-уже-готово', text:'13. Что уже готово'},
      {t:'kv', rows:[['Карта','42 процесса, каждый с результатом, шагами, сроком, критерием и исключениями. — Вкладка «Карта процессов»'], ['Tone of voice','Позиция, 8 правил, словарь замен, 14 шаблонов сообщений. — Вкладка «Tone of voice»'], ['Чек-лист приёмки','13 пунктов из вашего описания — готов к использованию. — Пункт 1.2'], ['Глоссарий','20 терминов с определениями (черновик — поправьте формулировки). — Вкладка «Глоссарий»'], ['Реестр ресурсов','72 позиции: папки, таблицы, чек-листы, шаблоны, бланки, инструкции, системы — со статусом и владельцем. — Вкладка «Реестр ресурсов»'], ['Задачник (правила)','Всё в задачнике: название по шаблону, что ожидается в результате, этапы, срок; закрытие — с таблицей и данными. — Вкладка «Задачник»']]},
      {t:'kv', rows:[['Бренд и оформление','Гайдлайн, лукбук, логотип + выжимка в 9 разделах и чек-лист перед отправкой. — Вкладка «Бренд и оформление»']]},

      {t:'table', side:true, head:['Термин','Что означает'], rows:[['Куратор','Сотрудник, который ведёт группу студентов от приёмки до выпуска: первый контакт, онбординг, сопровождение, проблемы и отчисления. Отвечает за качество данных студента.'], ['Старший куратор','Курирует кураторов: разбирает сложные случаи, ошибки, наставничество, эскалации.'], ['Руководитель отдела','Принимает решения по деньгам, отчислениям, возвратам, переводам и конфликтам.'], ['Группа','Учебная группа до 25 студентов с одним куратором и общим чатом.'], ['Код группы','Название группы: последние две цифры года + «_» + номер группы.'], ['Волна / поток','Период набора студентов: 1-я волна — до 1 сентября, 2-я — до 1 октября, 3-я — до 1 ноября.'], ['Приёмная комиссия','Принимает студентов, определяет формат оплаты, передаёт данные куратору.'], ['Отдел продаж','Передаёт таблицу студентов или доступ к CRM с данными.'], ['Журнал учёта студентов','Основной реестр: данные студента, группа, статус, каналы связи, дата приёмки.'], ['Журнал оплат','Таблица оплат по каждому студенту: формат, период, сумма, дата, чек, следующая оплата.'], ['Чек-лист приёмки','13 пунктов, по которым куратор принимает студента от приёмной комиссии.'], ['Онбординг','Период от первого контакта до выхода на учёбу: установочная встреча, доступы, правила общения.'], ['Установочная встреча','Первая встреча группы: знакомство, правила, платформа, дедлайны, вопросы.'], ['Кураторская встреча','Регулярная встреча группы с куратором (обычно раз в 2 недели): вопросы, поддержка, анонсы.'], ['Tone of voice','Правила общения куратора: на «ты», коротко, со следующим шагом, с готовыми шаблонами.'], ['Паспорт мышления','Профиль студента по измерениям (как учится, что мотивирует, где риски), собранный по наблюдениям на встречах.'], ['Контур.Толк','Сервис видеовстреч: записи, транскрипты, чаты встреч.'], ['Платформа колледжа','Внутренняя система: задачи, цели месяца, проекты, документы, финансы.'], ['Студенческая платформа','Система учёта студентов колледжа (app.rameevcollege.ru).'], ['Мессенджеры','Разрешённые каналы со студентом: Telegram и Макс. Студент выбирает один основной.'], ['Долг','Неоплаченная часть обучения после дедлайна (5 число месяца, следующего за оплачиваемым периодом).'], ['Пропуск','Отсутствие на занятии или встрече; отмечается как уважительный или неуважительный.'], ['Проблемный студент','Студент с сигналом: пропал, систематические пропуски, долг, конфликт, резкое падение.'], ['Академический отпуск','Приостановка обучения по заявлению с подтверждающими документами и планом возврата.'], ['Отчисление','Прекращение обучения: по заявлению, неуплате, неуспеваемости или нарушению договора.'], ['Отписка родителям','Письменное и телефонное уведомление родителя о ситуации студента (при наличии согласия).'], ['Справка','Документ об обучении: для военкомата, налогового вычета, банка и т. п.'], ['Рубрика оценки','Инструмент: 4 критерия (знание, логика, перенос, свои слова) по 0–3 балла, итог 0–12.'], ['К1–К4','Критерии оценки ответа: К1 знание, К2 логика, К3 перенос, К4 самостоятельность формулировки.'], ['Итог / риск','Сумма К1–К4. Итог ниже 5 из 12 — отметка «риск», студент идёт в работу куратора.'], ['Вопрос-крючок','Первый вопрос по реальной ситуации студента на платформе; раскрывает 1 критерий.'], ['Зонд','Короткий обязательный вопрос на критерий (15–20 сек), чтобы не ставить 0 просто потому, что не спросили.'], ['Цикл (предметов)','Группа предметов одного направления: Соцгум / Гуманитарный, Технический, Базовый, Углублённый.'], ['Предмет недели','Предмет, по которому на этой неделе проверяем знания; ротация по чётным и нечётным неделям.'], ['Подгруппа','Часть группы из 10–12 человек, внутри которой куратор проводит кураторские встречи и оценку знаний. Состав группы и подгрупп статичный.'], ['Охват оценок','Сколько оценок собрано по предмету или группе. Без охвата средний балл ничего не значит.'], ['Реестр доступов','Таблица с кодами доступа к карточкам оценок, логинами и паролями платформы, доступами родителей и к игре по био.'], ['Код доступа','Персональный код студента вида XXX-XXX для входа в карточку с оценками и посещаемостью.'], ['Карточка с оценками','Личная страница студента с оценками и посещаемостью, вход по коду доступа.'], ['Реестр оплат','Таблица оплат: 12 месяцев на студента, в каждой паре «месяц + ссылка на чек».'], ['Чек об оплате','Подтверждение оплаты месяца (фото/PDF), прикладывается к строке студента в реестре оплат.'], ['Задачник','Единая система задач отдела: любая работа оформляется задачей с результатом, этапами и сроком.'], ['Гайдлайн','Документ с правилами оформления: палитра, шрифты, шапка, таблицы, презентации, запреты.'], ['Лукбук','Набор визуальных примеров фирменного стиля — как должны выглядеть макеты.'], ['Закрытие задачи','Приложение таблицы с фактическими данными и изменениями + итог 1–2 строки.'], ['ЦКИБР','Цифровой колледж имени Башира Рамеева — сокращение в названии журналов и документов.'], ['Перезачёт','Признание дисциплин, изученных ранее (по диплому СПО или академической справке), без повторного изучения.'], ['Аттестат','Документ об образовании студента; хранится в колледже, отслеживается форма хранения и возврат.'], ['Личное дело','Номер дела студента в журнале учёта, например 2026-9-001.'], ['Кризисная ситуация','Случай, требующий немедленных действий: угроза здоровью, травля, агрессия, тяжёлое состояние. Фиксируется в отдельном журнале с уровнем и уведомлениями.'], ['Главный офис','Адрес хранения оригиналов документов студентов (аттестатов). Почта России: Казань, Спартаковская, 2. СДЭК: Спартаковская, 2, корпус 1.']]},
    ]
  },

/* ==========================================================================
   3. ДВИЖОК (менять не нужно)
   ========================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inl = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<span class="hl">$1</span>')
  .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,(m,a,t)=>`<a href="#/${a.replace('#','/')}">${t}</a>`)
  .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>');
const plain = s => String(s).replace(/\[\[[^\]|]+\|([^\]]+)\]\]/g,'$1').replace(/\*\*(.+?)\*\*/g,'$1').replace(/==(.+?)==/g,'$1').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'$1 ($2)');
const tx = o => typeof o==='string' ? o : Array.isArray(o) ? o.map(tx).join(' ') : o&&typeof o==='object' ? Object.entries(o).filter(([k])=>!['t','id','url','to','copy','side'].includes(k)&&k[0]!=='_').map(([,v])=>tx(v)).join(' ') : '';
const COPY = [];
const cbtn = (text,label) => { COPY.push(text); return `<button class="btn cp" data-c="${COPY.length-1}">▸ ${label||'Скопировать'}</button>`; };

// индексация: id разделов, тексты для поиска
DOCS.forEach(d => { let n=0, cur=null; d.blocks.forEach(b => {
  if(b.t==='h2'||b.t==='h3'){ b.id = b.id || 's'+(++n)+'x'; cur=b; }
  b._sec = cur; b._txt = plain(tx(b)); }); d._txt = plain(d.title+' '+(d.desc||'')); });

function renderBlock(b, st){
  switch(b.t){
    case 'h2': st.n++; return `<div class="eb"><span class="chip">${String(st.n).padStart(2,'0')}</span>${esc(b.eyebrow||'')}</div><h2 id="${b.id}">${inl(b.text)}</h2>`;
    case 'h3': return `<h3 id="${b.id}">${inl(b.text)}</h3>`;
    case 'p': return `<p>${inl(b.text)}</p>`+(b.copy?cbtn(plain(b.text)):'');
    case 'ul': return `<ul class="l">${b.items.map(i=>`<li>${inl(i)}</li>`).join('')}</ul>`;
    case 'ol': return `<ol class="l">${b.items.map(i=>`<li>${inl(i)}</li>`).join('')}</ol>`;
    case 'kv': return `<div class="kv">${b.rows.map(r=>`<div class="k">${inl(r[0])}</div><div class="v">${inl(r[1])}</div>`).join('')}</div>`;
    case 'important': return `<div class="imp"><span class="chip">${esc(b.title||'Важно')}</span>${inl(b.text)}${b.copy?'<br>'+cbtn(plain(b.text)):''}</div>`;
    case 'info': return `<div class="info"><b>${inl(b.title||'')}</b>${inl(b.text)}${b.copy?'<br>'+cbtn(plain(b.text)):''}</div>`;
    case 'quote': return `<div class="quote">${inl(b.text)}${b.copy?'<br>'+cbtn(plain(b.text)):''}</div>`;
    case 'msg': return `<div class="msg"><div class="h"><span>${inl(b.title||'Шаблон сообщения')}</span></div><div class="tx">${esc(plain(b.text))}</div>${cbtn(plain(b.text),'Скопировать сообщение')}</div>`;
    case 'table': { const c=(v,i,cls)=>{ const e=v===''||v==null; return `<td class="${e?'empty':(b.side&&i===0?'side':cls||'')}">${e?'':inl(v)}</td>`; };
      return `<div class="tw"><table><thead><tr>${b.head.map(h=>`<th>${inl(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map((v,i)=>c(v,i)).join('')}</tr>`).join('')}${b.foot?`<tr>${b.foot.map((v,i)=>c(v,i,'foot')).join('')}</tr>`:''}</tbody></table></div>`+(b.copy?cbtn(b.rows.map(r=>r.map(plain).join('\t')).join('\n'),'Скопировать таблицу'):''); }
    case 'cards': return `<div class="grid">${b.items.map(i=>`<${i.to?'a href="#/'+i.to.replace('#','/')+'"':'div'} class="card"><b>${inl(i.title)}</b><span class="d">${inl(i.text||'')}</span></${i.to?'a':'div'}>`).join('')}</div>`;
    case 'btn': return `<p><a class="btn" href="${esc(b.url)}" target="_blank" rel="noopener">▸ ${esc(b.text)}</a></p>`;
    case 'sep': return '<div class="sep"></div>';
  } return '';
}

let HL = [];
function highlight(root){
  if(!HL.length) return;
  const re = new RegExp('('+HL.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes=[];
  while(w.nextNode()) if(!w.currentNode.parentElement.closest('button,script')) nodes.push(w.currentNode);
  nodes.forEach(n => { if(!re.test(n.nodeValue)) return; re.lastIndex=0;
    const sp=document.createElement('span'); sp.innerHTML=esc(n.nodeValue).replace(re,'<mark>$1</mark>'); n.replaceWith(sp); });
}
const words = () => $('q').value.trim().toLowerCase().split(/\s+/).filter(w=>w.length>1);

function buildNav(cur){
  $('nav').innerHTML = `<a href="#/" class="${!cur?'on':''}">⌂ Оглавление</a>` + DOCS.map((d,i)=>
    `<a href="#/${d.id}" class="${cur&&cur.id===d.id?'on':''}"><span class="chip">${String(i+1).padStart(2,'0')}</span>${esc(d.title)}</a>` +
    (cur&&cur.id===d.id ? d.blocks.filter(b=>b.t==='h2').map(b=>`<a class="sec" href="#/${d.id}/${b.id}">${esc(plain(b.text))}</a>`).join('') : '')).join('');
}

function route(){
  const [,id,sec] = location.hash.split('/'); HL = words();
  const d = DOCS.find(x=>x.id===id); buildNav(d); const m=$('main');
  if(!d){
    m.innerHTML = `<div class="eb" style="margin-top:0">Оглавление</div><h1 class="d">Разделы базы знаний</h1>` + (DOCS.length ?
      `<div class="grid">${DOCS.map((x,i)=>`<a class="card" href="#/${x.id}"><span class="chip">${String(i+1).padStart(2,'0')}</span><b>${esc(x.title)}</b><span class="d">${esc(x.desc||'')}</span></a>`).join('')}</div>` :
      '<div class="info"><b>База знаний пока пуста</b>Добавьте документы в список DOCS — см. «Инструкция.txt».</div>');
    window.scrollTo(0,0); return;
  }
  const st={n:0};
  m.innerHTML = `<div class="eb" style="margin-top:0">${esc(d.eyebrow||'Документ')}</div><h1 class="d">${esc(d.title)}</h1><p class="small">${esc(d.desc||'')}</p>` + d.blocks.map(b=>renderBlock(b,st)).join('') +
    `<p style="margin-top:32px"><a class="btn" href="#/">▸ К оглавлению</a></p>`;
  highlight(m);
  const t = sec && $(sec); if(t) t.scrollIntoView(); else { const k=m.querySelector('mark'); k?k.scrollIntoView({block:'center'}):window.scrollTo(0,0); }
}

function search(){
  const ws = words(); if(!ws.length){ route(); return; } HL = ws; buildNav(null);
  const out=[]; DOCS.forEach(d=>{
    if(ws.every(w=>d._txt.toLowerCase().includes(w))) out.push({d, sec:null, txt:d.desc||'', title:d.title});
    d.blocks.forEach(b=>{ const low=b._txt.toLowerCase(); if(b._txt && ws.every(w=>low.includes(w))) out.push({d, sec:b._sec||null, txt:b._txt, title:d.title}); }); });
  const re = new RegExp('('+ws.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  $('main').innerHTML = `<div class="eb" style="margin-top:0">Поиск</div><h1 class="d">Найдено: ${out.length}</h1>` + (out.length? out.slice(0,60).map(r=>{
    const i=r.txt.toLowerCase().indexOf(ws[0]), s=r.txt.slice(Math.max(0,i-60), i+120);
    return `<a class="res" href="#/${r.d.id}${r.sec?'/'+r.sec.id:''}"><b>${esc(r.d.title)}</b><div class="p">${r.sec?'Раздел: '+esc(plain(r.sec.text)):'Документ целиком'}</div><div class="s">…${esc(s).replace(re,'<mark>$1</mark>')}…</div></a>`;}).join('') :
    '<div class="info"><b>Ничего не найдено</b>Попробуйте другое слово или его начало, например «распис» вместо «расписание».</div>');
  window.scrollTo(0,0);
}

/* вход */
const ok = () => { try{ return sessionStorage.getItem('kb_ok')==='1'; }catch(e){ return false; } };
function enter(){ $('login').classList.add('hide'); $('app').classList.remove('hide');
  $('h-org').textContent=CONFIG.org; $('h-title').textContent=CONFIG.title; $('h-sub').textContent=CONFIG.subtitle;
  $('h-date').textContent=CONFIG.date; $('h-date').classList.toggle('hide',!CONFIG.date);
  $('h-badge').textContent=CONFIG.badge; $('h-badge').classList.toggle('hide',!CONFIG.badge);
  const f=CONFIG.footer; $('foot').innerHTML = `<div><b>${inl(f.rulesTitle)}</b><br>${inl(f.rules)}</div>` +
    (f.contacts.length?`<div><b>${inl(f.contactsTitle)}</b><div class="kv">${f.contacts.map(r=>`<div class="k">${inl(r[0])}</div><div class="v">${inl(r[1])}</div>`).join('')}</div></div>`:'');
  route(); }
function tryLogin(){ if($('pw').value===String(CONFIG.password)){ try{sessionStorage.setItem('kb_ok','1');}catch(e){} enter(); } else { $('err').textContent='Неверный пароль. Проверьте и введите ещё раз.'; $('pw').select(); } }
$('go').onclick = tryLogin; $('pw').onkeydown = e => { if(e.key==='Enter') tryLogin(); };
$('q').oninput = search;
window.addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const r = e.target.closest('a.res'); if(r){ e.preventDefault(); const h=r.getAttribute('href'); location.hash===h ? route() : (location.hash=h); return; }
  const b = e.target.closest('[data-c]'); if(!b) return; const t = COPY[b.dataset.c], old = b.textContent;
  const done = () => { b.textContent='✓ Скопировано'; setTimeout(()=>b.textContent=old,1500); };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done,()=>fb(t,done)); else fb(t,done);
});
function fb(t,done){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand('copy');done();}catch(e){} a.remove(); }
if(ok()) enter(); else $('pw').focus();
</script>
</body>
</html>
