<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>База знаний — Цифровой колледж имени Башира Рамеева</title>
<!-- Шрифт: по умолчанию системный (Onest/Manrope/Montserrat, если установлены, иначе Arial).
     Чтобы подключить Onest из интернета, раскомментируйте строку ниже (нужен доступ в сеть):
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700;800&display=swap" rel="stylesheet"> -->
<style>
:root{--k:#1C1C1E;--b:#6F8FF0;--bl:#C8D4F8;--l:#EEFF6B;--bg:#F3F4F7;--nc:#F1F2F4;--g:#9AA0AB;--t:#5B6170}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Onest,Manrope,Montserrat,Arial,sans-serif;color:var(--k);background:var(--bg);line-height:1.5;font-size:15px}
a{color:var(--k);font-weight:700;text-decoration:underline;text-decoration-color:var(--b);text-decoration-thickness:2px;text-underline-offset:3px}
button{font-family:inherit}
.hide{display:none!important}
/* вход */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{background:#fff;border:1px solid var(--bl);border-left:6px solid var(--b);border-radius:14px;padding:28px;max-width:400px;width:100%}
.lbox img{height:48px;display:block;margin-bottom:20px}
.lbox h1{font-size:26px;font-weight:800;margin:0 0 6px}
.lbox p{color:var(--t);margin:0 0 16px;font-size:13px}
input{font-family:inherit;font-size:15px;border:1px solid var(--k);border-radius:10px;padding:10px 14px;width:100%;background:#fff;color:var(--k)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.btn{display:inline-block;background:var(--l);border:1px solid var(--k);border-radius:10px;color:var(--k);font-weight:700;font-size:12px;padding:7px 14px;cursor:pointer;text-decoration:none}
.btn.big{margin-top:12px;font-size:14px;padding:10px 20px}
#err{font-weight:700;font-size:13px;margin-top:10px;min-height:18px}
/* шапка */
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 40px}
.hero{background:linear-gradient(90deg,var(--b),#FAFBFF);border-radius:28px;padding:24px 28px;display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap;align-items:flex-start}
.logo{background:#fff;border-radius:16px;padding:8px 14px;display:inline-block;margin-bottom:16px}
.logo img{height:38px;display:block}
.org{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.hero h1{font-size:clamp(28px,5vw,40px);font-weight:800;margin:4px 0;line-height:1.15}
.sub{font-size:13px}
.plates{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.date{background:var(--k);color:#fff;font-weight:700;font-size:22px;border-radius:16px;padding:10px 20px}
.badge{background:var(--l);border:1px solid var(--k);font-weight:700;font-size:12px;border-radius:12px;padding:5px 12px}
.bar{display:flex;gap:10px;margin:16px 0;align-items:center}
.bar input{flex:1}
.lay{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
@media(max-width:820px){.lay{grid-template-columns:1fr}.hero{padding:20px}.plates{align-items:flex-start}}
/* меню */
nav{background:#fff;border:1px solid var(--bl);border-radius:14px;padding:10px;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
nav a{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:10px;text-decoration:none;font-weight:600;font-size:13px}
nav a:hover{background:var(--bg)}
nav a.on{background:var(--k);color:#fff}
nav a.sec{margin-left:22px;font-weight:400;font-size:12px;color:var(--t)}
.chip{display:inline-block;background:var(--l);border:1px solid var(--k);border-radius:8px;font-weight:700;font-size:12px;padding:1px 8px;color:var(--k);flex:none}
main{min-width:0}
.eb{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;display:flex;gap:8px;align-items:center;margin-top:32px}
h1.d{font-size:clamp(26px,4vw,36px);font-weight:800;margin:0 0 6px}
h2{font-size:clamp(22px,3vw,26px);font-weight:700;margin:8px 0 10px}
h3{font-size:17px;font-weight:700;margin:22px 0 6px}
p{margin:0 0 12px;max-width:80ch}
.small{font-size:12px;color:var(--t)}
/* карточки */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{display:block;background:#fff;border:1px solid var(--bl);border-left:6px solid var(--b);border-radius:14px;padding:15px;text-decoration:none;font-weight:400}
a.card:hover{border-color:var(--b)}
.card b{display:block;font-size:15px;margin:6px 0 2px}
.card span.d{color:var(--t);font-size:13px}
/* блоки */
.imp{position:relative;background:#fff;border:1px solid var(--bl);border-left:6px solid var(--b);border-radius:14px;padding:30px 16px 14px;margin:14px 0}
.imp .chip{position:absolute;top:-1px;left:12px;border-top:0;border-radius:0 0 8px 8px}
.info{background:var(--bg);border-radius:16px;padding:16px;margin:14px 0}
.main-bg .info{background:#E9EAEF}
.info>b{display:block;margin-bottom:4px}
.quote{background:var(--k);color:#fff;border-radius:16px;padding:20px;margin:14px 0;font-weight:700;font-size:18px}
.quote .hl{color:var(--l);background:none}
.msg{background:var(--nc);border:1px dashed var(--g);border-radius:14px;padding:14px 16px;margin:14px 0}
.msg .h{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px;font-weight:700}
.msg .tx{background:#fff;border:1px solid var(--g);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:14px}
.cp{margin-top:10px}
.hl{background:var(--l);border-radius:4px;padding:0 3px}
mark{background:var(--l);color:var(--k);border-radius:4px;padding:0 2px;outline:1px solid var(--k)}
ul.l{list-style:none;padding:0;margin:8px 0 14px}
ul.l li{position:relative;padding-left:20px;margin:7px 0}
ul.l li:before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:2px;background:var(--b)}
ol.l{list-style:none;padding:0;margin:8px 0 14px;counter-reset:n}
ol.l li{counter-increment:n;position:relative;padding-left:40px;margin:10px 0;min-height:28px}
ol.l li:before{content:counter(n);position:absolute;left:0;top:-1px;width:28px;height:28px;border-radius:8px;background:var(--k);color:#fff;font-weight:700;text-align:center;line-height:28px}
.tw{overflow-x:auto}
table{border-collapse:separate;border-spacing:8px;width:100%;min-width:480px;margin:6px -8px}
th{background:var(--k);color:#fff;border-radius:12px;padding:10px 14px;text-align:left;font-size:14px}
td{background:#fff;border:1px solid var(--bl);border-left:5px solid var(--b);border-radius:14px;padding:12px 14px;vertical-align:top}
td.side{background:var(--bg);border:0;font-weight:700}
td.empty{background:#F7F8FA;border:0}
td.foot{background:#E4E6EB;border:0;font-weight:700}
.kv{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:6px 16px;margin:10px 0}
.kv .k{color:var(--t)}.kv .v{font-weight:700}
.foot2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:36px}
@media(max-width:820px){.foot2{grid-template-columns:1fr}}
.foot2>div{background:var(--bg);border:1px solid #E1E3E9;border-radius:16px;padding:16px;font-size:12px}
.res{background:#fff;border:1px solid var(--bl);border-left:6px solid var(--b);border-radius:14px;padding:12px 16px;margin:8px 0;display:block;text-decoration:none;font-weight:400}
.res b{display:block}
.res .p{font-size:12px;color:var(--t)}
.res .s{font-size:13px;margin-top:4px}
.sep{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--b),#FAFBFF);margin:28px 0}
</style>
</head>

      {t:'ol', items:['1) Получить от отдела продаж реестр студентов: при передаче студента отдел продаж обязан подготовить реестр и направить его кураторам; альтернатива — доступ к CRM.', '2) Сверить список с чек-листом приёмки (п. [[priem#p1-2|1.2]]): по каждому студенту проверить наличие всех полей.', '3) Проверить актуальность каналов связи: телефон, мессенджер, почта студента и родителя.', '4) Проверить читаемость сканов: паспорт, СНИЛС, аттестат.', '5) Сверить базу образования и направление поступления с заявлением.', '6) Уточнить у приёмной комиссии или у студента всё, что отсутствует или не совпало.', '7) Внести исправления в журнал учёта, поставить дату приёмки и кто принял.', '8) Сообщить студенту, что данные приняты и канал связи настроен.']},
      {t:'p', text:'**Где ведётся.** «Журнал учёта | ЦКИБР» (списки студентов 9 и 11 кл: паспорт, СНИЛС, контакты, статус, номер дела), таблица или CRM отдела продаж, папка студента на Диске'},
      {t:'h3', id:'links-p1-1', text:'Что открыть'},
      {t:'ul', items:['[П-10 Студенты](https://drive.google.com/drive/folders/15z09G-Dv1zcff_bnclQfEBrbaPhDQ6wW)', '[П-11 Студенты / 2026_1 (первый запуск)](https://drive.google.com/drive/folders/1MRM13GZ38SnKHlWHv_k6_GnYrKkODTWd)', '[Т-07 Журнал учёта | ЦКИБР](https://docs.google.com/spreadsheets/d/1v_5wRXvl7QNq86ED9L2qTk5YKXMAGnmQX--VApBoiAY/edit)', '[С-04 Студенческая платформа](https://app.rameevcollege.ru)', '[У-01 📋 Список студентов 9 кл](https://docs.google.com/spreadsheets/d/1v_5wRXvl7QNq86ED9L2qTk5YKXMAGnmQX--VApBoiAY/edit#gid=1841324248)', '[У-02 📋 Список студентов 11 кл](https://docs.google.com/spreadsheets/d/1v_5wRXvl7QNq86ED9L2qTk5YKXMAGnmQX--VApBoiAY/edit#gid=957582019)', '[У-06 📜 Журнал приказов](https://docs.google.com/spreadsheets/d/1v_5wRXvl7QNq86ED9L2qTk5YKXMAGnmQX--VApBoiAY/edit#gid=1128509462)']},
      {t:'important', title:'Готово, если', text:'По каждому студенту волны все поля чек-листа заполнены, сканы читаемы, расхождений нет, в журнале стоит дата приёмки.'},
      {t:'info', title:'Если не по стандарту', text:'Нет данных / молчит отдел продаж: повторный запрос, через 2 дня — эскалация руководителю. Скан нечитаем: запросить заново у студента, продублировать в папку. Ошибку нашли после старта: исправляем сразу и фиксируем причину в журнале.'},
      {t:'info', title:'Примечание', text:'Ваш текст: после приёмки ответственность за ошибки в данных несёт куратор, поэтому проверка должна быть максимально внимательной.'},
      {t:'cards', items:[{title:'1.2 Чек-лист приёмки студента от приёмной комиссии', text:'связанный процесс', to:'priem#p1-2'}]},
      {t:'h2', id:'p1-2', text:'1.2 Чек-лист приёмки студента от приёмной комиссии'},
      {t:'p', text:'**Результат.** Единый чек-лист из 13 пунктов, по которому принимается каждый студент; ни один пункт не пропущен.'},
      {t:'kv', rows:[['Когда запускается','Идёт приёмка студента (вместе с п. [[priem#p1-1|1.1]]).'], ['Кто делает','Куратор'], ['Срок / SLA','Один студент — 15 минут; вся волна — до даты волны']]},
      {t:'ol', items:['Данные студента: 1) ФИО студента; 2) ФИО родителя; 3) почта родителя; 4) телефон студента и родителя.', 'Документы: 5) база образования; 6) направление поступления; 7) скан паспорта; 8) скан СНИЛС; 9) скан аттестата; 10) аттестат отправлен в офис (отметка).', 'Связь и оплата: 11) канал связи настроен (бот или аккаунт кураторов); 12) зафиксирован формат оплаты и оплаченные части.', '13) Со студентом связались и передали все данные на проверку.', 'Отметить в чек-листе дату проверки и подпись (ФИО куратора).']},
      {t:'p', text:'**Где ведётся.** «Список студентов 9/11 кл» в журнале учёта — 14 полей, плюс чек-лист приёмки'},
      {t:'h3', id:'links-p1-2', text:'Что открыть'},
      {t:'ul', items:['[П-06 Артефакты / Чек-листы](https://drive.google.com/drive/folders/1Y9lUVwuCYeGhpQuExg5sLK6SEJ8h5A4Q)', '[Т-07 Журнал учёта | ЦКИБР](https://docs.google.com/spreadsheets/d/1v_5wRXvl7QNq86ED9L2qTk5YKXMAGnmQX--VApBoiAY/edit)', '[У-01 📋 Список студентов 9 кл](https://docs.google.com/spreadsheets/d/1v_5wRXvl7QNq86ED9L2qTk5YKXMAGnmQX--VApBoiAY/edit#gid=1841324248)', '[У-02 📋 Список студентов 11 кл](https://docs.google.com/spreadsheets/d/1v_5wRXvl7QNq86ED9L2qTk5YKXMAGnmQX--VApBoiAY/edit#gid=957582019)', '[У-03 🎓 Журнал аттестатов](https://docs.google.com/spreadsheets/d/1v_5wRXvl7QNq86ED9L2qTk5YKXMAGnmQX--VApBoiAY/edit#gid=841972250)']},
      {t:'important', title:'Готово, если', text:'13/13 пунктов заполнены, дата и ФИО проверяющего стоят.'},
      {t:'info', title:'Если не по стандарту', text:'Пункт не выполним без студента (нет скана) — статус «на досыл», срок 3 дня, потом напоминание родителю.'},
      {t:'info', title:'Примечание', text:'Пункты 11–13 чаще всего забывают — вынесены в отдельный блок проверки.'},
      {t:'cards', items:[{title:'1.1 Приём данных студентов от приёмной комиссии', text:'связанный процесс', to:'priem#p1-1'}]},
      {t:'h2', id:'p1-3', text:'1.3 Первый контакт со студентом'},
      {t:'p', text:'**Результат.** Студент получил приветствие от куратора, знает, кто его куратор и куда писать; создан общий чат группы.'},
      {t:'kv', rows:[['Когда запускается','Данные студента приняты (п. [[priem#p1-1|1.1]]) и он добавлен в список волны.'], ['Кто делает','Куратор'], ['Срок / SLA','Первый контакт — в течение 1 рабочего дня после приёмки данных; ответ студенту — до 2 часов в рабочее время']]},
      {t:'ol', items:['1) Написать студенту в мессенджер (Telegram или Макс — что выбрал студент) по шаблону приветствия.', '2) В приветствии: имя куратора, «я с тобой весь период обучения», по каким вопросам писать (учёба, доступы), «моя задача — помочь, а не ругать и не проверять».', '3) Создать общий чат группы: название — код группы (например, 26_01), участники — только студенты этой группы.', '4) Добавить студента в чат группы, закрепить в чате правила и календарь ближайших событий.', '5) Отметить в журнале дату первого контакта и мессенджер.', '6) Уведомить студентов о ближайшей установочной / кураторской встрече и дедлайнах.']},
      {t:'p', text:'**Где ведётся.** Telegram / Макс, чат группы, журнал учёта'},
      {t:'h3', id:'links-p1-3', text:'Что открыть'},
      {t:'ul', items:['[П-04 Артефакты / Шаблоны сообщений](https://drive.google.com/drive/folders/1aIvvi9wFdvgLatVhF6n9ZL2iZpBnCUz4)', '[Т-07 Журнал учёта | ЦКИБР](https://docs.google.com/spreadsheets/d/1v_5wRXvl7QNq86ED9L2qTk5YKXMAGnmQX--VApBoiAY/edit)', '[Ш-01 Онбординг и встречи (4 шт.)](https://docs.google.com/spreadsheets/d/1lxLbSOwz_cs579BggFni6oH9q9ZxL2GLGjL-YrOpPXg/edit#gid=1779583989)', '[Вкладка «Tone of voice»](https://docs.google.com/spreadsheets/d/1lxLbSOwz_cs579BggFni6oH9q9ZxL2GLGjL-YrOpPXg/edit#gid=1779583989)']},
      {t:'important', title:'Готово, если', text:'Студент ответил (или зафиксирована попытка №2), он в чате группы, дата контакта в журнале.'},
      {t:'info', title:'Если не по стандарту', text:'Нет ответа 24 часа — звонок; 3 дня — сообщение родителю (с учётом п. [[onboarding#p2-9|2.9]]) и отметка «проблемный» (п. [[problemy#p4-1|4.1]]).'},
      {t:'info', title:'Примечание', text:'Ваш текст: контакт ведётся в том мессенджере, который удобен студенту (Telegram или Макс).'},
      {t:'cards', items:[{title:'1.1 Приём данных студентов от приёмной комиссии', text:'связанный процесс', to:'priem#p1-1'}, {title:'2.9 Согласие на контакт с родителями', text:'связанный процесс', to:'onboarding#p2-9'}, {title:'4.1 Проблемные студенты', text:'связанный процесс', to:'problemy#p4-1'}]},
      {t:'h2', id:'p1-4', text:'1.4 Формат оплаты и фиксация дальнейших платежей'},
      {t:'p', text:'**Результат.** Формат оплаты зафиксирован в журнале оплат, чек приложен, дата следующего платежа известна студенту и куратору.'},
      {t:'kv', rows:[['Когда запускается','Приёмная комиссия согласовала формат оплаты со студентом; поступила оплата.'], ['Кто делает','Куратор'], ['Срок / SLA','Дедлайн оплаты — до 5 числа месяца, следующего за оплачиваемым периодом; напоминание — за 15 дней']]},
      {t:'ol', items:['1) Получить от приёмной комиссии формат оплаты: бесплатная или платная.', '2) Для платной уточнить период: месячная, семестровая, годовая, разовая.', '3) Взять сумму к оплате в CRM — вручную не считаем.', '4) Отправить студенту ссылку на оплату rameevcollege.ru/qr и сумму.', '5) Сверить чек от студента или родителя с суммой в CRM.', '6) Поставить в «Реестре оплат» отметку «Оплачено», приложить чек, внести дату следующего платежа.', '7) Напомнить об оплате не позднее чем за 15 дней до дедлайна.']},
      {t:'p', text:'**Где ведётся.** «Реестр оплат» (Google Таблица), CRM (суммы), ссылка на оплату rameevcollege.ru/qr, папка студента'},
      {t:'h3', id:'links-p1-4', text:'Что открыть'},
      {t:'ul', items:['[Т-02 Реестр оплат](https://docs.google.com/spreadsheets/d/1F58-CEY6AihFsqCLKig6JgsufykY4ZkigjT3nxSzD54/edit)', '[Т-07 Журнал учёта | ЦКИБР](https://docs.google.com/spreadsheets/d/1v_5wRXvl7QNq86ED9L2qTk5YKXMAGnmQX--VApBoiAY/edit)', '[Ш-02 Деньги (3 шт.)](https://docs.google.com/spreadsheets/d/1lxLbSOwz_cs579BggFni6oH9q9ZxL2GLGjL-YrOpPXg/edit#gid=1779583989)', '[Д-12 Оплата: ссылка и порядок](https://rameevcollege.ru/qr)', '[Вкладка «Tone of voice»](https://docs.google.com/spreadsheets/d/1lxLbSOwz_cs579BggFni6oH9q9ZxL2GLGjL-YrOpPXg/edit#gid=1779583989)']},
      {t:'important', title:'Готово, если', text:'Формат и период в журнале, чек сверен куратором, стоит «Оплачено», дата следующего платежа известна, студент подтвердил.'},
      {t:'info', title:'Если не по стандарту', text:'Нет чека — просим повторно, оплату считаем неподтверждённой. Долг после 5 числа — п. 3.5. Сомнения в сумме — сверка с бухгалтерией.'},
      {t:'info', title:'Примечание', text:'Ваш текст: формат оплаты определяет приёмная комиссия совместно со студентом; бесплатная и платная; платная — месячная, семестровая, годовая, разовая.'},
      {t:'cards', items:[{title:'3.5 Долги', text:'связанный процесс', to:'soprovozhdenie#p3-5'}]},
      {t:'h2', id:'p1-5', text:'1.5 Распределение студентов по группам'},
      {t:'p', text:'**Результат.** Студент закреплён за группой и подгруппой; у группы есть код, чат и куратор.'},
      {t:'kv', rows:[['Когда запускается','Студент прошёл приёмку и оплату (или поступил на бесплатное).'], ['Кто делает','Куратор'], ['Срок / SLA','В день приёмки студента; при открытии новой группы — сразу после 25-го человека']]},
      {t:'ol', items:['1) Распределить студентов в статичные группы до 25 человек; состав группы меняется только через п. 3.8.', '2) Внутри группы разделить на подгруппы по 10–12 человек — для кураторских встреч и оценки знаний.', '3) Заполнять группы по очереди: 01, 02, 03 и далее.', '4) Название группы: последние две цифры года + «_» + индекс группы (пример: 26_01).', '5) Внести код группы и номер подгруппы в журнал учёта.', '6) Создать чат группы (п. [[priem#p1-3|1.3]]) и назначить куратора.', '7) Сообщить студенту его группу, подгруппу и куратора.']},
      {t:'p', text:'**Где ведётся.** Журнал учёта студентов, чаты групп в мессенджерах'},
      {t:'h3', id:'links-p1-5', text:'Что открыть'},
      {t:'ul', items:['[П-11 Студенты / 2026_1 (первый запуск)](https://drive.google.com/drive/folders/1MRM13GZ38SnKHlWHv_k6_GnYrKkODTWd)', '[Т-07 Журнал учёта | ЦКИБР](https://docs.google.com/spreadsheets/d/1v_5wRXvl7QNq86ED9L2qTk5YKXMAGnmQX--VApBoiAY/edit)', '[О-05 Составы групп и явка](https://docs.google.com/spreadsheets/d/1iXXIVilEIZ3gT2qyuc7NGgLs5wn9U9haRpk4KNehqXY/edit#gid=2013635953)']},
      {t:'important', title:'Готово, если', text:'У студента в журнале стоит код группы, он в чате группы, куратор назначен.'},
      {t:'info', title:'Если не по стандарту', text:'Группа переполнена — открываем следующую по порядку. Студент просит другую группу — п. 3.8.'},
      {t:'info', title:'Примечание', text:'26_01 — это название группы. Подгруппы по 10–12 человек нужны только для кураторских встреч и оценки знаний.'},
      {t:'cards', items:[{title:'3.8 Перевод между группами и смена направления', text:'связанный процесс', to:'soprovozhdenie#p3-8'}, {title:'1.3 Первый контакт со студентом', text:'связанный процесс', to:'priem#p1-3'}]},
      {t:'h2', id:'p1-6', text:'1.6 Договор и документы студента'},
      {t:'p', text:'**Результат.** Все документы студента лежат в одной папке, договор подписан, допсоглашения подшиты.'},
      {t:'kv', rows:[['Когда запускается','Студент зачислен; меняются условия (оплата, форма обучения, перевод).'], ['Кто делает','Куратор'], ['Срок / SLA','В течение 3 рабочих дней после зачисления']]},
      {t:'ol', items:['1) Создать папку студента на Диске: «Фамилия Имя_код группы».', '2) Положить скан подписанного договора и допсоглашений.', '3) Проверить, что в договоре есть условия уведомления об отчислении и перерасчёта.', '4) Отметить в журнале учёта «договор есть / нет».', '5) Оригинал аттестата передать в главный офис — там он и хранится.', '6) Зафиксировать аттестат в «Журнале аттестатов»: вид, серия и номер, дата получения колледжем.', '7) Выдача аттестата: доставка в ближайший пункт СДЭК (Спартаковская, 2, корпус 1) или Почтой России (Казань, Спартаковская, 2) за счёт студента.', '8) После выдачи и после получения направить студенту или родителю справку о выдаче и справку о получении.']},
      {t:'p', text:'**Где ведётся.** Папка студента на Google Диске; «Журнал аттестатов» в журнале учёта (форма хранения, дата получения, отметка о возврате)'},
      {t:'h3', id:'links-p1-6', text:'Что открыть'},
      {t:'ul', items:['[П-10 Студенты](https://drive.google.com/drive/folders/15z09G-Dv1zcff_bnclQfEBrbaPhDQ6wW)', '[П-12 Студенты / 26_01](https://drive.google.com/drive/folders/1o-XRWh0B4z3Zxd6X_cIKD8NZY-DVc7Bz)', '[П-13 Студенты / 26_02](https://drive.google.com/drive/folders/1ngAB8RoCALKmYvjsNKh9bkOUBv3pyaQ8)', '[П-14 Студенты / 26_11](https://drive.google.com/drive/folders/1eM4f14lB375nxhAVqjYY7RdD0uHiVC0-)', '[Т-07 Журнал учёта | ЦКИБР](https://docs.google.com/spreadsheets/d/1v_5wRXvl7QNq86ED9L2qTk5YKXMAGnmQX--VApBoiAY/edit)', '[У-03 🎓 Журнал аттестатов](https://docs.google.com/spreadsheets/d/1v_5wRXvl7QNq86ED9L2qTk5YKXMAGnmQX--VApBoiAY/edit#gid=841972250)']},
      {t:'important', title:'Готово, если', text:'Договор и документы в папке, отметки в журнале; аттестат сдан в главный офис и записан в «Журнал аттестатов».'},
      {t:'info', title:'Если не по стандарту', text:'Договор не подписан — обучение не стартует, эскалация руководителю.'},
      {t:'info', title:'Примечание', text:'Предложено мной: без папки и договора невозможно быстро оформить справку, возврат и отчисление.'},
      {t:'h2', id:'p1-7', text:'1.7 Возврат и перерасчёт оплаты'},
      {t:'p', text:'**Результат.** Заявление принято, расчёт сделан по договору, деньги возвращены или перенесены, студент уведомлён.'},
      {t:'kv', rows:[['Когда запускается','Студент отказывается от обучения, меняет формат оплаты или отчислен с неиспользованным периодом.'], ['Кто делает','Куратор → Руководитель → Бухгалтерия'], ['Срок / SLA','Расчёт — 3 рабочих дня; возврат — до 10 рабочих дней после согласования']]},

      {t:'kv', rows:[['Когда запускается','Группа набрана (п. [[priem#p1-5|1.5]]), до старта занятий.'], ['Кто делает','Куратор'], ['Срок / SLA','Приглашение — за 5 дней; явка ≥ 80%; резюме — в течение 24 часов']]},

      {t:'kv', rows:[['Когда запускается','Любое сообщение студента в личку или в чат группы.'], ['Кто делает','Куратор'], ['Срок / SLA','2 часа в рабочее время; сложные вопросы — 1 рабочий день']]},
      {t:'ol', items:['1) Ответить в течение 2 часов в рабочее время: «принял, отвечу до <время>».', '2) Если вопрос не в зоне куратора — сказать, кому передал и когда вернётся ответ.', '3) Не оставлять без ответа вопросы про оплату, отчисление и здоровье — эскалировать сразу.', '4) Ответ в чате группы — если вопрос общий, в личку — если личное.', '5) После 19:00 и в выходные — ответ на следующий рабочий день до 10:00.']},

      {t:'p', text:'**Результат.** Чек-лист первой недели закрыт: доступы, знакомство, первая домашка, вопрос-ответ.'},
      {t:'kv', rows:[['Когда запускается','Студент прошёл установочную встречу.'], ['Кто делает','Куратор'], ['Срок / SLA','5 рабочих дней с момента установочной встречи']]},

      {t:'ol', items:['1) Спросить студента: можно ли связываться с родителем, с кем именно.', '2) Для 18+ — только письменное согласие студента.', '3) Внести в журнал: ФИО родителя, телефон, почта, объём согласия.', '4) При отказе — контакт с родителем только в критической ситуации и по согласованию с руководителем.']},

      {t:'info', title:'Если не по стандарту', text:'Родитель пишет сам — отвечаем вежливо и фиксируем, но личные данные студента не раскрываем без согласия.'},
      {t:'info', title:'Примечание', text:'Предложено мной: защищает куратора и студента, снимает конфликты.'},

  {

    desc: '3. Сопровождение студентов в период обучения — 12 процессов',

      {t:'h2', id:'p3-1', text:'3.1 Кураторские встречи'},
      {t:'p', text:'**Результат.** Кураторские встречи идёт по расписанию, посещаемость отмечена, знания проверены по рубрике (0–12), риск-студенты переданы в работу.'},
      {t:'kv', rows:[['Когда запускается','По календарю группы (раз в 2 недели); встречи проводятся по подгруппам по 10–12 человек; оценка знаний — еженедельно по предмету недели.'], ['Кто делает','Куратор'], ['Срок / SLA','Анонс — за 7 дней; резюме — 24 часа; оценка — 2–3 минуты на студента; явка ≥ 70%']]},
      {t:'ol', items:['1) За 7 дней согласовать дату и тему, создать встречу в Толке.', '2) Отправить анонс в чат группы и напомнить за 1 день и за 1 час.', '3) Открыть платформу: работы и оценки студентов за неделю.', '4) По каждому студенту задать 1 вопрос-крючок по его работе и до 2 зондов, оценить К1–К4.', '5) Сразу после встречи внести строки в журнал оценки группы (дата, предмет, ФИО, баллы).', '6) Отметить посещаемость; итог ниже 5 — в журнал проблемных (п. [[problemy#p4-1|4.1]]).', '7) Отправить резюме в чат в течение 24 часов и обновить дашборд.']},
      {t:'p', text:'**Где ведётся.** Контур.Толк (запись, транскрипт), чат группы, «Рабочая тетрадь кураторов» (журналы оценки, дашборд)'},
      {t:'h3', id:'links-p3-1', text:'Что открыть'},
      {t:'ul', items:['[П-02 База знаний](https://drive.google.com/drive/folders/1qZt5knSTPC3W8gcTb6jWeyrAgfPmeh35)', '[П-09 База знаний / Регламенты](https://drive.google.com/drive/folders/1r6tDuIshbtfGm3SJnIjHTVRDkonNukxk)', '[П-16 Встречи](https://drive.google.com/drive/folders/1zHMzZ-kN9g7f8C-iFu9q4r4rGS78ymSj)', '[П-18 Встречи / Кураторские встречи](https://drive.google.com/drive/folders/1em0P_2OJrvFSZhO74jxl08hsVVLiNF_B)', '[Т-16 Рабочая тетрадь кураторов](https://docs.google.com/spreadsheets/d/1iXXIVilEIZ3gT2qyuc7NGgLs5wn9U9haRpk4KNehqXY/edit)', '[Ш-01 Онбординг и встречи (4 шт.)](https://docs.google.com/spreadsheets/d/1lxLbSOwz_cs579BggFni6oH9q9ZxL2GLGjL-YrOpPXg/edit#gid=1779583989)', '[С-05 Контур.Толк](https://ktalk.ru)', '[Вкладка «Оценка На Встречах»](https://docs.google.com/spreadsheets/d/1lxLbSOwz_cs579BggFni6oH9q9ZxL2GLGjL-YrOpPXg/edit#gid=1286795904)']},

      {t:'info', title:'Примечание', text:'Оценка знаний — часть встречи. Отчётность по ней — лист «Дашборд» в «Рабочей тетради кураторов».'},
      {t:'cards', items:[{title:'4.1 Проблемные студенты', text:'связанный процесс', to:'problemy#p4-1'}]},
      {t:'h2', id:'p3-2', text:'3.2 Справки и документы'},
      {t:'p', text:'**Результат.** Студент получил нужную справку в срок, выдача зафиксирована.'},
      {t:'kv', rows:[['Когда запускается','Запрос студента: обучение, военкомат, налоговый вычет, банк, виза.'], ['Кто делает','Куратор (запрос) → Учебный отдел (изготовление) → Руководитель отдела кураторов (подпись)'], ['Срок / SLA','Запрос в журнал — в день обращения; выдача — 2–3 рабочих дня (по факту в журнале)']]},
      {t:'ol', items:['1) Принять запрос: тип справки, куда и к какому сроку.', '2) Проверить статус студента: нет ли долгов и незакрытых документов.', '3) Внести запрос в «Журнал справок об обучении» (журнал ЦКИБР): ФИО, назначение, дата запроса.', '4) Передать запрос в учебный отдел — справку готовит он.', '5) Подпись ставит руководитель отдела кураторов.', '6) Получить готовую справку, приложить файл и дату выдачи в журнал.', '7) Отправить студенту и отметить выдачу.']},
      {t:'p', text:'**Где ведётся.** «Журнал учёта | ЦКИБР» → лист «Справки об обучении»; папка «База знаний/Справки»'},
      {t:'h3', id:'links-p3-2', text:'Что открыть'},
      {t:'ul', items:['[П-02 База знаний](https://drive.google.com/drive/folders/1qZt5knSTPC3W8gcTb6jWeyrAgfPmeh35)', '[П-08 База знаний / Справки](https://drive.google.com/drive/folders/1KBOzWkt_XA_C6bInu6eKt13Mer7onnvM)', '[П-12 Студенты / 26_01](https://drive.google.com/drive/folders/1o-XRWh0B4z3Zxd6X_cIKD8NZY-DVc7Bz)', '[П-13 Студенты / 26_02](https://drive.google.com/drive/folders/1ngAB8RoCALKmYvjsNKh9bkOUBv3pyaQ8)', '[П-14 Студенты / 26_11](https://drive.google.com/drive/folders/1eM4f14lB375nxhAVqjYY7RdD0uHiVC0-)', '[Т-07 Журнал учёта | ЦКИБР](https://docs.google.com/spreadsheets/d/1v_5wRXvl7QNq86ED9L2qTk5YKXMAGnmQX--VApBoiAY/edit)', '[Ш-03 Учёба и поддержка (4 шт.)](https://docs.google.com/spreadsheets/d/1lxLbSOwz_cs579BggFni6oH9q9ZxL2GLGjL-YrOpPXg/edit#gid=1779583989)']},
      {t:'important', title:'Готово, если', text:'Справка изготовлена, подписана руководителем, файл и дата выдачи в журнале, студент получил.'},
      {t:'info', title:'Если не по стандарту', text:'Есть долг — сообщаем условие выдачи и даём срок на оплату; спор — руководитель.'},
      {t:'h2', id:'p3-3', text:'3.3 Пропуски и посещаемость'},
      {t:'p', text:'**Результат.** Посещаемость сведена за неделю, уважительные причины отмечены, риск-студенты выявлены.'},
      {t:'kv', rows:[['Когда запускается','Еженедельно (пятница); после каждой встречи/занятия.'], ['Кто делает','Куратор'], ['Срок / SLA','Сводка — каждый четверг/пятницу; реакция на пропуск — 2 рабочих дня']]},
      {t:'ol', items:['1) Собрать данные от преподавателей и из платформы.', '2) Сверить с сообщениями студентов, отметить уважительные причины.', '3) Занести в журнал посещаемости.', '4) Если причина не подтверждена — попросить объяснительную по шаблону Б-08.', '5) Студентам с пропусками больше 25% — личное сообщение и план возврата.', '6) Раз в неделю — сводка руководителю по группе.']},
      {t:'p', text:'**Где ведётся.** Журнал посещаемости, платформа, чат группы'},
      {t:'h3', id:'links-p3-3', text:'Что открыть'},
      {t:'ul', items:['[Т-03 Реестр доступов](https://docs.google.com/spreadsheets/d/1IPxeR06B1_Xs6fKtapl_gl58aCiy5M6F_FI8QMy59uM/edit)', '[Т-04 Реестр доступов / лист «Доступы к карточкам с оценками»](https://docs.google.com/spreadsheets/d/1IPxeR06B1_Xs6fKtapl_gl58aCiy5M6F_FI8QMy59uM/edit#gid=1287348389)', '[С-04 Студенческая платформа](https://app.rameevcollege.ru)', '[О-05 Составы групп и явка](https://docs.google.com/spreadsheets/d/1iXXIVilEIZ3gT2qyuc7NGgLs5wn9U9haRpk4KNehqXY/edit#gid=2013635953)', '[Б-08 Шаблон объяснительной записки](https://docs.google.com/document/d/1AmMWsuXzFiPzF72X06MoqflK63FXOUNl/edit)']},
      {t:'important', title:'Готово, если', text:'Таблица заполнена за неделю, риск-студенты помечены, им написано.'},
      {t:'info', title:'Если не по стандарту', text:'Длительное отсутствие (болезнь) — п. [[soprovozhdenie#p3-9|3.9]]; исчез — п. 4.1.'},
      {t:'cards', items:[{title:'3.9 Академический отпуск и возврат', text:'связанный процесс', to:'soprovozhdenie#p3-9'}, {title:'4.1 Проблемные студенты', text:'связанный процесс', to:'problemy#p4-1'}]},
      {t:'h2', id:'p3-4', text:'3.4 Просьбы преподавателей'},
      {t:'p', text:'**Результат.** Просьба принята, передана студенту с конкретным сроком, выполнена, преподаватель получил ответ.'},
      {t:'kv', rows:[['Когда запускается','Преподаватель просит что-то передать, собрать, проверить, напомнить.'], ['Кто делает','Куратор'], ['Срок / SLA','Ответ преподавателю — 1 рабочий день; задача студентам — в тот же день']]},
      {t:'ol', items:['1) Зафиксировать: кто, что, к какому сроку.', '2) Переформулировать в понятную задачу для студента.', '3) Отправить в чат группы или лично, поставить срок.', '4) Проверить выполнение, при необходимости напомнить.', '5) Ответить преподавателю: сделано / не сделано и почему.', '6) Вне зоны куратора — эскалация руководителю.']},
      {t:'p', text:'**Где ведётся.** Чат группы, журнал задач, платформа'},
      {t:'important', title:'Готово, если', text:'Преподаватель получил письменный ответ по каждой просьбе.'},
      {t:'info', title:'Если не по стандарту', text:'Просьба противоречит правилам или учебному плану — согласуем с руководителем, не выполняем молча.'},
      {t:'h2', id:'p3-5', text:'3.5 Долги'},
      {t:'p', text:'**Результат.** Задолженность выявлена, студент и родитель уведомлены, оплата получена или согласован график.'},
      {t:'kv', rows:[['Когда запускается','После 5 числа месяца; при сверке журнала оплат.'], ['Кто делает','Куратор → Старший куратор'], ['Срок / SLA','15 дней до дедлайна — напоминание; 5 число — второе; срок предупреждения об отчислении — по решению руководителя (индивидуально)']]},
      {t:'ol', items:['1) Сверить «Реестр оплат»: кто не оплатил период.', '2) Напомнить студенту за 15 дней до дедлайна (шаблон).', '3) После 5 числа — второе напоминание и звонок.', '4) При долге 10 дней — сообщение родителю (с учётом п. [[onboarding#p2-9|2.9]]).', '5) Приложить чек от студента или родителя и обновить статус.', '6) Предупреждение о риске отчисления: срок и порядок определяет руководитель отдела кураторов по каждому случаю индивидуально, письменно.']},
      {t:'p', text:'**Где ведётся.** «Реестр оплат», журнал обращений, чат группы'},
      {t:'h3', id:'links-p3-5', text:'Что открыть'},
      {t:'ul', items:['[П-04 Артефакты / Шаблоны сообщений](https://drive.google.com/drive/folders/1aIvvi9wFdvgLatVhF6n9ZL2iZpBnCUz4)', '[Т-02 Реестр оплат](https://docs.google.com/spreadsheets/d/1F58-CEY6AihFsqCLKig6JgsufykY4ZkigjT3nxSzD54/edit)', '[Ш-02 Деньги (3 шт.)](https://docs.google.com/spreadsheets/d/1lxLbSOwz_cs579BggFni6oH9q9ZxL2GLGjL-YrOpPXg/edit#gid=1779583989)', '[Д-12 Оплата: ссылка и порядок](https://rameevcollege.ru/qr)', '[Вкладка «Tone of voice»](https://docs.google.com/spreadsheets/d/1lxLbSOwz_cs579BggFni6oH9q9ZxL2GLGjL-YrOpPXg/edit#gid=1779583989)']},
      {t:'important', title:'Готово, если', text:'Долг закрыт или есть письменный график платежей с датами.'},
      {t:'info', title:'Если не по стандарту', text:'Обещает и не платит — эскалация руководителю. Срок предупреждения и последствия по каждому студенту определяет руководитель отдела кураторов.'},
      {t:'cards', items:[{title:'2.9 Согласие на контакт с родителями', text:'связанный процесс', to:'onboarding#p2-9'}]},
      {t:'h2', id:'p3-6', text:'3.6 Жалобы и предложения'},
      {t:'p', text:'**Результат.** Жалоба принята, классифицирована, решена или эскалирована; студент получил ответ в срок.'},
      {t:'kv', rows:[['Когда запускается','Студент или родитель недоволен: учёба, преподаватель, платформа, куратор, оплата.'], ['Кто делает','Куратор → Старший куратор → Руководитель'], ['Срок / SLA','Первая реакция — 2 часа; решение — 3 рабочих дня или срок эскалации']]},
      {t:'ol', items:['1) Записать: кто, что, когда, что уже пробовали.', '2) Поблагодарить, не спорить и не защищаться.', '3) Классифицировать: учёба / преподаватель / платформа / куратор / оплата.', '4) В своей зоне — решить за 1 рабочий день.', '5) Вне зоны — передать с описанием, сказать студенту срок ответа.', '6) Вернуться с решением в обещанный срок, даже если решения ещё нет.', '7) Раз в месяц — сводка повторяющихся жалоб руководителю.']},
      {t:'p', text:'**Где ведётся.** Журнал обращений, мессенджер, Толк'},
      {t:'h3', id:'links-p3-6', text:'Что открыть'},
      {t:'ul', items:['[П-03 База знаний / Артефакты](https://drive.google.com/drive/folders/1DtJrvrG0PYQ5lqiqup0InkDQZeLHBvWh)', '[Ш-03 Учёба и поддержка (4 шт.)](https://docs.google.com/spreadsheets/d/1lxLbSOwz_cs579BggFni6oH9q9ZxL2GLGjL-YrOpPXg/edit#gid=1779583989)', '[Вкладка «Tone of voice»](https://docs.google.com/spreadsheets/d/1lxLbSOwz_cs579BggFni6oH9q9ZxL2GLGjL-YrOpPXg/edit#gid=1779583989)']},
      {t:'important', title:'Готово, если', text:'Обращение в журнале, студент получил ответ, повторных жалоб по тому же поводу нет.'},
      {t:'info', title:'Если не по стандарту', text:'Жалоба на куратора — сразу старшему куратору, куратор не отвечает сам. Угрозы/травля — немедленно руководителю.'},
      {t:'h2', id:'p3-7', text:'3.7 Напоминания и дедлайны'},
      {t:'p', text:'**Результат.** Ни один дедлайн не пропущен незамеченным: студенты предупреждены заранее, невыполнившие зафиксированы.'},
      {t:'kv', rows:[['Когда запускается','Ведётся календарь дедлайнов группы; наступает дата.'], ['Кто делает','Куратор'], ['Срок / SLA','За 3 дня и за 1 день до дедлайна']]},
      {t:'ol', items:['1) Вести календарь: оплаты, домашки, зачёты, встречи.', '2) Напоминать за 3 дня и за 1 день; оплата — за 15 дней (п. [[priem#p1-4|1.4]]).', '3) После дедлайна — список невыполнивших, личные сообщения.', '4) Повторное невыполнение — звонок и, при необходимости, родитель.', '5) Итоги недели — в резюме группы.']},
      {t:'p', text:'**Где ведётся.** Календарь дедлайнов (таблица), чат группы'},
      {t:'h3', id:'links-p3-7', text:'Что открыть'},
      {t:'ul', items:['[Вкладка «Tone of voice»](https://docs.google.com/spreadsheets/d/1lxLbSOwz_cs579BggFni6oH9q9ZxL2GLGjL-YrOpPXg/edit#gid=1779583989)']},
      {t:'important', title:'Готово, если', text:'Календарь заполнен на месяц вперёд, по каждому дедлайну есть напоминание.'},
      {t:'info', title:'Если не по стандарту', text:'Дедлайн перенесли — сообщаем всем и обновляем календарь.'},
      {t:'cards', items:[{title:'1.4 Формат оплаты и фиксация дальнейших платежей', text:'связанный процесс', to:'priem#p1-4'}]},
      {t:'h2', id:'p3-8', text:'3.8 Перевод между группами и смена направления'},
      {t:'p', text:'**Результат.** Студент переведён, все системы и чаты обновлены, куратор и группа в курсе.'},
      {t:'kv', rows:[['Когда запускается','Запрос студента или рекомендация куратора.'], ['Кто делает','Куратор → Руководитель'], ['Срок / SLA','Решение — 3 рабочих дня; перевод — в день согласования']]},
      {t:'ol', items:['1) Понять причину: расписание, конфликт, уровень, направление.', '2) Проверить, есть ли место в другой группе (до 25).', '3) Согласовать с руководителем и учебным отделом.', '4) Обновить журнал, платформу, чаты: убрать из старой группы, добавить в новую.', '5) Познакомить с новым куратором, передать паспорт и историю.']},

      {t:'p', text:'**Результат.** Студент в отпуске, оплата и дедлайны приостановлены, возврат запланирован.'},
      {t:'kv', rows:[['Когда запускается','Болезнь, семейные обстоятельства, служба, длительная нетрудоспособность.'], ['Кто делает','Куратор → Учебный отдел'], ['Срок / SLA','Оформление — 3 рабочих дня; контакт перед возвратом — за 14 дней']]},
      {t:'ol', items:['1) Принять заявление и подтверждающие документы.', '2) Согласовать с руководителем и учебным отделом срок отпуска.', '3) Зафиксировать: дата начала, дата возврата, что с оплатой (п. [[priem#p1-7|1.7]]).', '4) Убрать из активного чата/оставить в чате выпуска — по решению.', '5) За 14 дней до возврата связаться и собрать план входа в учёбу.']},
      {t:'p', text:'**Где ведётся.** Журнал учёта, платформа'},

      {t:'h2', id:'p3-10', text:'3.10 Мероприятия и анонсы'},
      {t:'p', text:'**Результат.** Группа знает о мероприятиях заранее, пришла, обратная связь собрана.'},
      {t:'kv', rows:[['Когда запускается','Календарь мероприятий колледжа или инициатива куратора.'], ['Кто делает','Куратор'], ['Срок / SLA','Анонс — за 7 дней']]},
      {t:'ol', items:['1) За 7 дней — анонс с датой, временем, ссылкой и зачем идти.', '2) Напоминание за 1 день и за 1 час.', '3) Отметить посещаемость.', '4) Собрать 2–3 отзыва, лучшие — в общий чат.']},

      {t:'h2', id:'p3-11', text:'3.11 Отчётность куратора'},

      {t:'important', title:'Готово, если', text:'Строка группы заполнена, цифры сошлись с журналами, руководитель в курсе рисков.'},
      {t:'info', title:'Если не по стандарту', text:'Охват оценок низкий — не делаем выводов о качестве, разбираемся с графиком встреч.'},
      {t:'info', title:'Примечание', text:'Дашборд не заменяет сводку: это цифры, а выводы пишет куратор.'},
      {t:'h2', id:'p3-12', text:'3.12 Перезачёт и переаттестация'},
      {t:'p', text:'**Результат.** Документы студента о законченном образовании переданы в учебную часть, перезачёт оформлен; куратор фиксирует статус в журнале.'},
      {t:'kv', rows:[['Когда запускается','У студента есть законченное образование — высшее или среднее профессиональное — и подтверждающие документы (диплом с приложением).'], ['Кто делает','Куратор (передача документов) → Учебная часть (перезачёт)'], ['Срок / SLA','Передача документов — 2 рабочих дня; сроки перезачёта — по регламенту учебной части']]},
      {t:'ol', items:['1) Принять от студента документы о законченном образовании: диплом СПО или ВО с приложением.', '2) Сохранить копии в папку студента.', '3) Внести студента в «Журнал перезачётов» и передать оригиналы в учебную часть.', '4) Перезачёт и решение комиссии — зона учебной части, сроки и порядок у неё.', '5) Когда учебная часть сообщит результат, внести в журнал номер приказа и итог.', '6) Сообщить студенту: что перезачтено, что придётся изучать.']},
      {t:'p', text:'**Где ведётся.** «Журнал учёта | ЦКИБР» → лист «Журнал перезачетов»; папка студента на Диске'},
      {t:'h3', id:'links-p3-12', text:'Что открыть'},
      {t:'ul', items:['[У-04 Журнал перезачетов](https://docs.google.com/spreadsheets/d/1v_5wRXvl7QNq86ED9L2qTk5YKXMAGnmQX--VApBoiAY/edit#gid=859043390)']},
      {t:'important', title:'Готово, если', text:'Документы переданы, запись в журнале есть, номер приказа и результат внесены, студент уведомлён.'},

      {t:'h2', id:'p4-1', text:'4.1 Проблемные студенты'},
      {t:'p', text:'**Результат.** Причина найдена, студент и родитель в курсе, есть план и дата контрольной точки.'},
      {t:'kv', rows:[['Когда запускается','Сигнал: пропал на 3+ дня, систематические пропуски, долг, конфликт, жалоба преподавателя, резкое падение.'], ['Кто делает','Куратор → Старший куратор → Руководитель'], ['Срок / SLA','Контакт — 1 рабочий день с сигнала; контрольная точка — 7 дней; уровень ситуации и решения — руководитель отдела кураторов']]},
      {t:'ol', items:['1) Зафиксировать сигнал в журнале: дата, что случилось.', '2) Связаться лично — звонок или голосом, не в общем чате.', '3) Выяснить причину своими словами, записать.', '4) Согласовать план: что делает студент, что делаем мы, когда проверяем.', '5) Не помогло — доложить руководителю отдела кураторов: он определяет уровень ситуации и следующий шаг (родитель, психолог, органы).', '6) Контрольная точка через 7 дней, записать результат.', '7) Нет динамики за 2 недели — предложить рассмотрение отчисления (п. [[problemy#p4-4|4.4]]); решение принимает руководитель.']},
      {t:'p', text:'**Где ведётся.** Журнал проблемных студентов (нужно создать); для тяжёлых случаев — «Журнал кризисных ситуаций» в журнале учёта'},
      {t:'h3', id:'links-p4-1', text:'Что открыть'},
      {t:'ul', items:['[Т-07 Журнал учёта | ЦКИБР](https://docs.google.com/spreadsheets/d/1v_5wRXvl7QNq86ED9L2qTk5YKXMAGnmQX--VApBoiAY/edit)', '[Т-16 Рабочая тетрадь кураторов](https://docs.google.com/spreadsheets/d/1iXXIVilEIZ3gT2qyuc7NGgLs5wn9U9haRpk4KNehqXY/edit)', '[О-03 Рубрика оценки ответа (К1–К4)](https://docs.google.com/spreadsheets/d/1iXXIVilEIZ3gT2qyuc7NGgLs5wn9U9haRpk4KNehqXY/edit#gid=877389039)']},
      {t:'important', title:'Готово, если', text:'В журнале причина, план, дата контрольной точки; студент в курсе; эскалация на нужном уровне.'},
      {t:'info', title:'Если не по стандарту', text:'Уровень и решение определяет руководитель отдела кураторов — обращаемся к нему сразу. Отказ от контакта — письменное сообщение и звонок родителю; агрессия и угрозы — немедленно руководителю.'},
      {t:'cards', items:[{title:'4.4 Отчисления', text:'связанный процесс', to:'problemy#p4-4'}, {title:'4.7 Кризисные ситуации', text:'связанный процесс', to:'problemy#p4-7'}]},
      {t:'h2', id:'p4-2', text:'4.2 Отписка родителям'},
      {t:'p', text:'**Результат.** Родитель получил структурированное сообщение о ситуации, реакция и договорённости зафиксированы.'},
      {t:'kv', rows:[['Когда запускается','Критическая ситуация: пропуски, долг, риск отчисления, конфликт. Требуется согласие (п. [[onboarding#p2-9|2.9]]).'], ['Кто делает','Куратор → Старший куратор'], ['Срок / SLA','Звонок — 1 рабочий день; письменное резюме — в тот же день']]},
      {t:'ol', items:['1) Проверить согласие студента на контакт с родителем; 18+ — только по письменному согласию.', '2) Собрать факты: даты, что произошло, что уже сделали мы.', '3) Позвонить, затем продублировать письменно в мессенджер (шаблон).', '4) Без обвинений: факты + что предлагаем + что нужно от родителя.', '5) Записать итог разговора и договорённости в журнал.', '6) Родитель против решения — эскалация руководителю.']},
      {t:'p', text:'**Где ведётся.** Журнал учёта, мессенджер, Контур.Толк (встреча)'},
      {t:'h3', id:'links-p4-2', text:'Что открыть'},
      {t:'ul', items:['[П-03 База знаний / Артефакты](https://drive.google.com/drive/folders/1DtJrvrG0PYQ5lqiqup0InkDQZeLHBvWh)', '[П-04 Артефакты / Шаблоны сообщений](https://drive.google.com/drive/folders/1aIvvi9wFdvgLatVhF6n9ZL2iZpBnCUz4)', '[Т-06 Реестр доступов / лист «Родители»](https://docs.google.com/spreadsheets/d/1IPxeR06B1_Xs6fKtapl_gl58aCiy5M6F_FI8QMy59uM/edit#gid=230127040)', '[Ш-04 Родители и отчисление (2 шт.)](https://docs.google.com/spreadsheets/d/1lxLbSOwz_cs579BggFni6oH9q9ZxL2GLGjL-YrOpPXg/edit#gid=1779583989)', '[Вкладка «Tone of voice»](https://docs.google.com/spreadsheets/d/1lxLbSOwz_cs579BggFni6oH9q9ZxL2GLGjL-YrOpPXg/edit#gid=1779583989)']},
      {t:'important', title:'Готово, если', text:'Разговор состоялся, письменное сообщение отправлено, договорённости в журнале.'},
      {t:'info', title:'Если не по стандарту', text:'Родитель не берёт трубку 2 дня — письменно, копию руководителю.'},
      {t:'cards', items:[{title:'2.9 Согласие на контакт с родителями', text:'связанный процесс', to:'onboarding#p2-9'}]},
      {t:'h2', id:'p4-3', text:'4.3 Встречи с родителями и студентами'},
      {t:'p', text:'**Результат.** Встреча проведена, решения записаны, у каждого есть ответственный и срок.'},
      {t:'kv', rows:[['Когда запускается','Сложная ситуация: отчисление, конфликт, долг, академические проблемы.'], ['Кто делает','Куратор → Старший куратор → Руководитель'], ['Срок / SLA','Протокол — 24 часа; контроль решений — по срокам протокола']]},
      {t:'ol', items:['1) Согласовать дату, состав участников и повестку за 2 дня.', '2) Отправить приглашение со ссылкой в Толк.', '3) Провести встречу, вести протокол: вопрос, решение, кто, когда.', '4) Отправить протокол всем участникам в течение 24 часов.', '5) Проконтролировать исполнение, напомнить за день до срока.']},

      {t:'important', title:'Готово, если', text:'Протокол отправлен, решения имеют владельца и срок, исполнение проверено.'},

      {t:'h2', id:'p4-4', text:'4.4 Отчисления'},
      {t:'p', text:'**Результат.** Студент отчислен по основанию, документы собраны, доступы закрыты, все уведомлены.'},
      {t:'kv', rows:[['Когда запускается','Заявление студента, неуплата, академическая неуспеваемость, нарушение договора.'], ['Кто делает','Куратор → Руководитель отдела кураторов → Учебный отдел / Бухгалтерия'], ['Срок / SLA','Уведомление — срок определяет руководитель; закрытие доступов выполняет руководитель в день отчисления']]},
      {t:'ol', items:['1) Определить основание и проверить условия договора.', '2) Сообщить студенту и родителю письменно с датой отчисления; срок предупреждения определяет руководитель по каждому случаю.', '3) Собрать документы: заявление, договор, расчёт, служебная записка.', '4) Согласовать с руководителем, передать в учебный отдел и бухгалтерию.', '5) Куратор подаёт заявку на закрытие доступов, закрывает их руководитель отдела кураторов; убрать студента из чата, обновить журнал и платформу.', '6) Предложить альтернативу: академический отпуск ([[soprovozhdenie#p3-9|3.9]]) или возврат ([[priem#p1-7|1.7]]).', '7) Через 2 недели — короткий контакт: почему ушёл (для улучшения процессов).']},

      {t:'important', title:'Готово, если', text:'Документы в папке, статус обновлён везде, доступы закрыты, студент уведомлён письменно.'},

      {t:'cards', items:[{title:'3.9 Академический отпуск и возврат', text:'связанный процесс', to:'soprovozhdenie#p3-9'}, {title:'1.7 Возврат и перерасчёт оплаты', text:'связанный процесс', to:'priem#p1-7'}, {title:'4.3 Встречи с родителями и студентами', text:'связанный процесс', to:'problemy#p4-3'}]},
      {t:'h2', id:'p4-5', text:'4.5 Восстановление после отчисления'},
      {t:'p', text:'**Результат.** Студент вернулся, условия и оплата согласованы, группа и доступы восстановлены.'},
      {t:'kv', rows:[['Когда запускается','Обращение отчисленного студента.'], ['Кто делает','Куратор → Руководитель'], ['Срок / SLA','Решение — 5 рабочих дней']]},
      {t:'ol', items:['1) Уточнить причину ухода и что изменилось.', '2) Согласовать условия восстановления и оплату с руководителем.', '3) Определить группу и точку входа в программу.', '4) Восстановить доступы, добавить в чат, познакомить с группой.', '5) Дать план догоняния на 2 недели.']},
      {t:'p', text:'**Где ведётся.** Журнал учёта, платформа'},
      {t:'h3', id:'links-p4-5', text:'Что открыть'},
      {t:'ul', items:['[П-06 Артефакты / Чек-листы](https://drive.google.com/drive/folders/1Y9lUVwuCYeGhpQuExg5sLK6SEJ8h5A4Q)', '[П-15 Студенты / Архив](https://drive.google.com/drive/folders/16gd3Xw_Xf6ZdGa-XqolM8ekPxNy3DSdV)']},

      {t:'h2', id:'p4-6', text:'4.6 Выпуск и итоговые документы'},
      {t:'p', text:'**Результат.** Студент закрыл программу, получил документы, оставил отзыв, попал в базу выпускников.'},
      {t:'kv', rows:[['Когда запускается','Студент прошёл все дисциплины и защиты.'], ['Кто делает','Куратор → Учебный отдел'], ['Срок / SLA','Документы — по срокам учебного отдела; финальная встреча — до выпуска']]},
      {t:'ol', items:['1) Сверить: все домашки, зачёты и оплаты закрыты.', '2) Заказать итоговые документы в учебном отделе.', '3) Проверить аттестат в «Журнале аттестатов»: оригинал хранится в главном офисе.', '4) Выдача: доставка в ближайший пункт СДЭК (Спартаковская, 2, корпус 1) или Почтой России (Казань, Спартаковская, 2) за счёт студента.', '5) Направить студенту или родителю справку о выдаче и справку о получении.', '6) Провести финальную встречу: итоги, обратная связь, что дальше.', '7) Собрать отзыв и разрешение на публикацию.', '8) Отметить выпуск в журнале, закрыть доступы.']},

      {t:'important', title:'Готово, если', text:'Документы выданы, справки о выдаче и получении отправлены, отзыв собран, статус «выпускник», доступы закрыты.'},

      {t:'h2', id:'p4-7', text:'4.7 Кризисные ситуации'},
      {t:'p', text:'**Результат.** Ситуация внесена в «Журнал кризисных ситуаций» журнала ЦКИБР, студент и семья получили помощь, уведомления отправлены, дело закрыто.'},
      {t:'kv', rows:[['Когда запускается','Выявлена кризисная ситуация: угроза здоровью или жизни, агрессия, травля, тяжёлое эмоциональное состояние, ЧП.'], ['Кто делает','Куратор → Руководитель отдела кураторов → Психолог'], ['Срок / SLA','Фиксация — в день выявления; обращение к руководителю — немедленно; остальные сроки — по решению руководителя']]},
      {t:'ol', items:['1) Сразу зафиксировать в «Журнале кризисных ситуаций» (журнал ЦКИБР): дата и время (МСК), ФИО, группа, возраст, тип, факты без оценок и домыслов. Уровень сами не проставляем.', '2) Немедленно обратиться к руководителю отдела кураторов; при прямой угрозе жизни звонить в экстренные службы, не дожидаясь согласований.', '3) По указанию руководителя оформить служебную записку и внести её дату.', '4) Организовать встречу с психологом по решению руководителя, внести дату и оценку риска.', '5) Уведомить родителей или близких — по решению руководителя, с учётом п. 2.9.', '6) Направить информацию в органы — по решению руководителя: орган, исходящий номер, дата.', '7) Назначить ответственного, вести статус до закрытия, указать дату закрытия и ссылку на дело случая.']},
      {t:'p', text:'**Где ведётся.** «Журнал учёта | ЦКИБР» → лист «Журнал кризисных ситуаций»; дело случая в папке «Отдел»'},
      {t:'h3', id:'links-p4-7', text:'Что открыть'},
      {t:'ul', items:['[У-07 🚨 Журнал кризисных ситуаций](https://docs.google.com/spreadsheets/d/1v_5wRXvl7QNq86ED9L2qTk5YKXMAGnmQX--VApBoiAY/edit#gid=2026111301)']},
      {t:'important', title:'Готово, если', text:'Все поля журнала заполнены, каждое уведомление датировано, статус «закрыто», ссылка на дело есть.'},
      {t:'info', title:'Если не по стандарту', text:'Уровень не определяем самостоятельно: фиксируем факты и сразу обращаемся к руководителю отдела кураторов — он решает, кого и в какой срок уведомлять.'},

      {t:'h2', id:'p5-1', text:'5.1 Найм и стажировка куратора'},

      {t:'ol', items:['1) Показать маршрут новичка: база знаний → 1 неделя с наставником → тень → самостоятельно под присмотром.', '2) Дать доступы и посадить на 3 процесса под контролем.', '3) Проверить по чек-листу: приёмка, первый контакт, ответ студенту.', '4) Через 2 недели — разбор ошибок, через месяц — самостоятельность.']},

      {t:'ol', items:['1) Изменение процесса — сначала в базу, потом в работу.', '2) Владелец раздела вносит правку и ставит дату.', '3) Ежеквартально — ревью: что устарело, что не используется.', '4) Новые формулировки из практики — в библиотеку шаблонов.']},

      {t:'kv', rows:[['Когда запускается','Первый рабочий день нового куратора.'], ['Кто делает','Куратор + Руководитель отдела'], ['Срок / SLA','Доступы — 1 рабочий день с момента письма; маршрут новичка — 5 рабочих дней']]},
      {t:'ol', items:['1) Написать на почту руководителя отдела кураторов свою рабочую почту — с неё выдаются доступы.', '2) Получить доступы: задачник, платформа колледжа, студенческая платформа, Google Диск «Отдел кураторов», Контур.Толк.', '3) Получить доступы к рабочим файлам: «Реестр доступов», «Реестр оплат», «Рабочая тетрадь кураторов», эта база знаний.', '4) Проверить вход в каждую систему; если чего-то нет — сразу написать руководителю.', '5) Прочитать три вещи: «Карту процессов», «Tone of voice», «Задачник».', '6) Завести в задачнике задачу «Пройти маршрут первой недели» и вести её по шагам.', '7) Взять первые 3 задачи у старшего куратора.']},
